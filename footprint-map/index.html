<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人旅行足迹地图 | My Travel Footprint Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 地图容器 -->
    <div id="map"></div>
    
    <!-- 照片弹窗 Modal -->
    <div class="modal-overlay" id="photoModal" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close" id="modalClose" aria-label="关闭弹窗">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
            <div class="modal-body">
                <div class="modal-photo">
                    <img id="modalImage" src="" alt="旅行照片">
                </div>
                <div class="modal-info">
                    <h2 id="modalTitle" class="modal-title"></h2>
                    <p id="modalDate" class="modal-date"></p>
                    <p id="modalDesc" class="modal-desc"></p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 页面标题（移动端显示） -->
    <header class="page-header">
        <h1>我的旅行足迹</h1>
        <p class="subtitle">My Travel Footprint Map</p>
    </header>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    
    <!-- App Logic -->
    <script src="js/app.js"></script>
</body>
</html>
