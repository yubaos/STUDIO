
                        <!DOCTYPE html>
                        <html lang="en">
                        <head>
                            <meta charset="UTF-8">
                            <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>
                body {
                  background-color: white; /* Ensure the iframe has a white background */
                }

                /* ============================================================
   行迹山海 · Footprint Atlas —— style.css
   护照手账风：深海军蓝侧栏 + 纸面卡片 + 邮戳红 + 定位蓝
   内含 Leaflet 关键结构兜底样式：leaflet.css CDN 失效时地图依然可用
   ============================================================ */
:root {
  --ink: #0d2334;
  --ink-2: #10293e;
  --ink-3: #16344f;
  --paper: #f8f6f0;
  --paper-2: #f4f0e4;
  --line: #d8d2c4;
  --red: #cf4a3d;
  --blue: #1d6fd1;
  --gold: #d9b36a;
  --sea: #a9c9d6;
  --font-body: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --font-display: 'ZCOOL XiaoWei', 'Noto Sans SC', sans-serif;
  --font-hand: 'Ma Shan Zheng', 'Noto Sans SC', cursive;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: grid;
  grid-template-columns: 396px 1fr;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--ink);
}
::selection { background: var(--gold); color: var(--ink); }

/* ==================== 加载层（含错误态） ==================== */
.loader {
  position: fixed; inset: 0; z-index: 3000;
  display: grid; place-items: center;
  background:
    radial-gradient(circle at 80% 10%, rgba(217,179,106,.12), transparent 45%),
    repeating-linear-gradient(0deg, transparent 0 34px, rgba(233,228,216,.04) 34px 35px),
    linear-gradient(165deg, #10293e, #0b1f30 60%, #0d2740);
  transition: opacity .55s ease;
}
.loader.done { opacity: 0; pointer-events: none; }
.loader-inner { text-align: center; }
.loader-orbit {
  width: 92px; height: 92px; margin: 0 auto;
  border: 2px dashed rgba(217,179,106,.55);
  border-radius: 50%;
  position: relative;
  animation: slowSpin 3.4s linear infinite;
}
.loader-plane {
  position: absolute; top: -13px; left: 50%;
  width: 24px; height: 24px; margin-left: -12px;
  fill: var(--gold);
  transform: rotate(90deg);
}
.loader-text {
  margin: 24px 0 6px;
  font-family: var(--font-display);
  font-size: 19px; letter-spacing: .12em; color: var(--paper-2);
}
.loader-text .dots i { font-style: normal; animation: blink 1.2s infinite; }
.loader-text .dots i:nth-child(2) { animation-delay: .2s; }
.loader-text .dots i:nth-child(3) { animation-delay: .4s; }
.loader-sub {
  margin: 0; font-family: var(--font-mono);
  font-size: 10px; letter-spacing: .42em; color: rgba(244,240,228,.4);
}
.loader-retry {
  display: none;
  margin-top: 20px;
  padding: 10px 28px;
  border: 1px solid rgba(217,179,106,.55);
  border-radius: 999px;
  background: transparent;
  color: var(--paper-2);
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: .3em;
  cursor: pointer;
  transition: background .25s ease, transform .25s ease;
}
.loader-retry:hover { background: rgba(217,179,106,.16); transform: translateY(-1px); }
.loader.error .loader-retry { display: inline-block; }
.loader.error .dots { display: none; }
.loader.error .loader-orbit { animation-play-state: paused; border-color: rgba(207,74,61,.55); }
.loader.error .loader-plane { fill: var(--red); }
@keyframes blink { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
@keyframes slowSpin { to { transform: rotate(360deg); } }

/* ==================== 侧栏（旅行手账） ==================== */
.sidebar {
  position: relative;
  display: flex; flex-direction: column;
  overflow: hidden;
  color: #ece7db;
  background:
    radial-gradient(circle at 110% -10%, rgba(224,159,62,.14), transparent 42%),
    radial-gradient(circle at -20% 110%, rgba(29,111,209,.18), transparent 46%),
    repeating-linear-gradient(0deg, transparent 0 34px, rgba(233,228,216,.045) 34px 35px),
    linear-gradient(165deg, #10293e, #0b1f30 55%, #0d2740);
}
.sidebar::before {
  content: ""; position: absolute; top: -150px; right: -150px;
  width: 340px; height: 340px; border-radius: 50%;
  border: 2px dashed rgba(217,179,106,.16);
  box-shadow: inset 0 0 0 26px rgba(217,179,106,.05);
  animation: slowSpin 90s linear infinite;
  pointer-events: none;
}
.sidebar > * { position: relative; z-index: 1; }
.sheet-handle { display: none; }

.side-head {
  padding: 24px 26px 18px;
  border-bottom: 1px dashed rgba(236,231,219,.18);
}

/* ---- LOGO（与 about 页面统一样式） ---- */
.head-top { display: flex; align-items: center; gap: 15px; margin-bottom: 18px; }
.home-logo {
  flex: none; display: block;
  width: 42px; height: 52px;
  cursor: pointer; text-decoration: none;
  color: var(--paper-2);
  -webkit-tap-highlight-color: transparent;
  transition: color .3s ease, transform .3s ease;
}
.home-logo svg {
  display: block; width: 100%; height: 100%;
  overflow: visible;
  fill: currentColor;
  filter: drop-shadow(0 1px 0 rgba(0,0,0,.18));
  transition: transform .3s ease, filter .3s ease, color .3s ease;
}
.home-logo:hover svg, .home-logo:focus-visible svg {
  transform: translateY(-3px);
  filter: drop-shadow(0 7px 9px rgba(0,0,0,.32));
  color: var(--paper-2);
}
.home-logo:focus-visible { outline: none; }
.head-text { min-width: 0; }
.overline {
  margin: 0 0 5px;
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase;
  color: var(--gold);
}
.overline-sub {
  margin: 0;
  font-family: var(--font-display);
  font-size: 16px; letter-spacing: .2em;
  color: rgba(236,231,219,.82);
}

/* ---- 统计 ---- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 2px; }
.stat { text-align: center; }
.stat + .stat { border-left: 1px dashed rgba(236,231,219,.2); }
.stat-num {
  display: block;
  font-family: var(--font-mono);
  font-size: 30px; font-weight: 700; line-height: 1.1;
  color: var(--paper-2);
}
.stat span { font-size: 11px; letter-spacing: .2em; color: rgba(236,231,219,.55); }

/* ---- 区块标题 ---- */
.side-block { padding: 18px 26px 6px; }
.side-block--grow { flex: 1; overflow-y: auto; padding-bottom: 18px; }
.side-block--grow::-webkit-scrollbar { width: 8px; }
.side-block--grow::-webkit-scrollbar-thumb { background: rgba(236,231,219,.18); border-radius: 99px; }
.block-title {
  margin: 0 0 12px;
  font-size: 13px; font-weight: 700; letter-spacing: .22em;
  color: var(--gold);
  display: flex; align-items: center;
}
.block-title i {
  width: 8px; height: 8px; margin-right: 9px;
  background: var(--red);
  transform: rotate(45deg);
}
.block-title em {
  margin-left: 10px;
  font-family: var(--font-mono); font-style: normal;
  font-size: 9.5px; letter-spacing: .3em;
  color: rgba(236,231,219,.4);
}

/* ---- 区域 chips ---- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px 7px 10px;
  border: 1px solid rgba(236,231,219,.28);
  border-radius: 999px;
  background: transparent;
  color: #ece7db;
  font-family: var(--font-body);
  font-size: 12.5px;
  cursor: pointer;
  transition: transform .22s ease, background .22s ease, border-color .22s ease, color .22s ease, box-shadow .22s ease;
}
.chip:hover { transform: translateY(-2px); border-color: var(--gold); }
.chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.chip-dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.12); }
.chip-all .chip-dot { background: linear-gradient(135deg, var(--red) 50%, var(--blue) 50%); }
.chip-en { font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; opacity: .55; }
.chip.is-active {
  background: var(--paper-2); color: var(--ink-3);
  border-color: transparent;
  box-shadow: 0 6px 14px rgba(4,14,24,.4);
}

/* ---- 时间线 ---- */
.tl-list { position: relative; padding-left: 22px; }
.tl-list::before {
  content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px;
  border-left: 2px dashed rgba(236,231,219,.22);
}
.tl-item {
  position: relative; margin-bottom: 16px;
  opacity: 0; transform: translateY(16px);
  transition: opacity .6s ease, transform .6s ease;
}
.tl-item.revealed { opacity: 1; transform: none; }
.tl-node {
  position: absolute; left: -21px; top: 16px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--rc, var(--blue));
  box-shadow: 0 0 0 3px #0d2334, 0 0 12px var(--rc, var(--blue));
  animation: nodeGlow 3s ease-in-out infinite alternate;
}
@keyframes nodeGlow {
  from { box-shadow: 0 0 0 3px #0d2334, 0 0 4px var(--rc, var(--blue)); }
  to   { box-shadow: 0 0 0 3px #0d2334, 0 0 14px var(--rc, var(--blue)); }
}
.tl-card {
  display: grid; grid-template-columns: 84px 1fr; gap: 12px;
  padding: 12px;
  background: var(--paper);
  color: var(--ink);
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 2px 0 rgba(0,0,0,.3);
  transition: transform .3s cubic-bezier(.2,.9,.3,1.2), box-shadow .3s ease;
}
.tl-card:hover { transform: translateX(6px) rotate(-.4deg); box-shadow: 0 12px 26px rgba(0,0,0,.38); }
.tl-card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.tl-item.is-current .tl-card { box-shadow: 0 0 0 2px var(--gold), 0 12px 26px rgba(0,0,0,.38); }
.tl-media {
  position: relative;
  width: 84px;
  aspect-ratio: 1 / 1;
  border-radius: 6px;
  overflow: hidden;
  background: #dfe6e2;
}

.tl-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.tl-card:hover .tl-media img { transform: scale(1.14); }
.tl-play {
  position: absolute; inset: 0; margin: auto;
  width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(13,35,52,.72); color: var(--paper);
  font-size: 10px; padding-left: 2px;
}
.tl-idx {
  position: absolute; top: 4px; left: 4px;
  padding: 1px 5px; border-radius: 3px;
  background: rgba(13,35,52,.72); color: var(--paper);
  font-family: var(--font-mono); font-size: 9px;
}
.tl-body { min-width: 0; }
.tl-date { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; color: var(--red); }
.tl-date em {
  font-style: normal; margin-left: 7px;
  font-size: 9px; letter-spacing: .14em;
  color: rgba(13,35,52,.45);
}
.tl-body h3 {
  margin: 3px 0 4px;
  font-family: var(--font-display); font-weight: 400;
  font-size: 17px; letter-spacing: .06em;
}
.tl-body h3 small {
  margin-left: 7px;
  font-family: var(--font-body); font-size: 11px; font-weight: 400;
  color: rgba(13,35,52,.55); letter-spacing: 0;
}
.tl-body p {
  margin: 0;
  font-size: 12px; line-height: 1.65;
  color: rgba(13,35,52,.72);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* ==================== Leaflet 关键结构兜底样式 ====================
 * 即使 leaflet.css 因 CDN 问题未能加载，地图的瓦片定位、图层层级、
 * 缩放动画、控件布局与交互光标依然完整可用。 */
.leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow,
.leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas,
.leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer {
  position: absolute; left: 0; top: 0;
}
.leaflet-container { overflow: hidden; }
.leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow {
  -webkit-user-select: none; user-select: none; -webkit-user-drag: none;
}
.leaflet-tile::selection { background: transparent; }
.leaflet-marker-icon, .leaflet-marker-shadow { display: block; }
.leaflet-container .leaflet-overlay-pane svg,
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile { max-width: none !important; max-height: none !important; }
.leaflet-pane { z-index: 400; }
.leaflet-tile-pane { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane { z-index: 500; }
.leaflet-marker-pane { z-index: 600; }
.leaflet-tooltip-pane { z-index: 650; }
.leaflet-popup-pane { z-index: 700; }
.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg { z-index: 200; }
.leaflet-tile { filter: inherit; visibility: hidden; }
.leaflet-tile-loaded { visibility: inherit; }
.leaflet-zoom-box { width: 0; height: 0; box-sizing: border-box; z-index: 800; }
.leaflet-zoom-animated { transform-origin: 0 0; }
.leaflet-zoom-anim .leaflet-zoom-animated {
  will-change: transform;
  transition: transform .25s cubic-bezier(0, 0, .25, 1);
}
.leaflet-zoom-anim .leaflet-tile, .leaflet-pan-anim .leaflet-tile { transition: none; }
.leaflet-zoom-anim .leaflet-zoom-hide { visibility: hidden; }
.leaflet-interactive { cursor: pointer; }
.leaflet-grab { cursor: grab; }
.leaflet-crosshair, .leaflet-crosshair .leaflet-interactive { cursor: crosshair; }
.leaflet-popup-pane, .leaflet-control { cursor: auto; }
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive { cursor: move; }
.leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-image-layer,
.leaflet-pane > svg path, .leaflet-tile-container { pointer-events: none; }
.leaflet-marker-icon.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive {
  pointer-events: visiblePainted;
  pointer-events: auto;
}
.leaflet-control { position: relative; z-index: 800; pointer-events: auto; float: left; clear: both; }
.leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
.leaflet-top { top: 0; } .leaflet-right { right: 0; }
.leaflet-bottom { bottom: 0; } .leaflet-left { left: 0; }
.leaflet-right .leaflet-control { float: right; }
.leaflet-top .leaflet-control { margin-top: 10px; }
.leaflet-bottom .leaflet-control { margin-bottom: 10px; }
.leaflet-left .leaflet-control { margin-left: 10px; }
.leaflet-right .leaflet-control { margin-right: 10px; }
.leaflet-bar { border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,.4); }
.leaflet-bar a {
  background-color: #fff; border-bottom: 1px solid #ccc;
  width: 26px; height: 26px; line-height: 26px;
  display: block; text-align: center; text-decoration: none; color: #000;
}
.leaflet-control-attribution { background: rgba(255,255,255,.8); padding: 0 5px; font-size: 11px; }
.leaflet-control-scale-line {
  border: 2px solid #777; border-top: none;
  line-height: 1.1; padding: 2px 5px 1px;
  font-size: 11px; white-space: nowrap;
  background: rgba(255,255,255,.5);
}
.leaflet-tooltip {
  position: absolute; padding: 6px;
  background-color: #fff; border: 1px solid #fff; border-radius: 3px;
  color: #222; white-space: nowrap;
  -webkit-user-select: none; user-select: none;
  pointer-events: none;
  box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
.leaflet-tooltip-top:before, .leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before, .leaflet-tooltip-right:before {
  position: absolute; pointer-events: none;
  border: 6px solid transparent; background: transparent; content: "";
}
.leaflet-tooltip-top { margin-top: -6px; }
.leaflet-tooltip-bottom { margin-top: 6px; }
.leaflet-tooltip-top:before, .leaflet-tooltip-bottom:before { left: 50%; margin-left: -6px; }
.leaflet-tooltip-top:before { bottom: 0; margin-bottom: -12px; border-top-color: #fff; }
.leaflet-tooltip-bottom:before { top: 0; margin-top: -12px; border-bottom-color: #fff; }
.leaflet-tooltip-left { margin-left: -6px; }
.leaflet-tooltip-right { margin-left: 6px; }
.leaflet-tooltip-left:before { right: 0; margin-right: -12px; border-left-color: #fff; }
.leaflet-tooltip-right:before { left: 0; margin-left: -12px; border-right-color: #fff; }

/* ==================== 地图舞台 ==================== */
.map-wrap { position: relative; overflow: hidden; }
#map { position: absolute; inset: 0; }
.leaflet-container {
  background: var(--sea);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
.leaflet-container:focus { outline: none; }

/* ---- 缩放动画：让 SVG 区域与瓦片共用 Leaflet 的原生缩放变换 ----
 * 不使用 non-scaling-stroke；它会让高亮描边在动画期间按不同规则重绘，
 * 视觉上像是暂时脱离底图。 */
.leaflet-overlay-pane path { vector-effect: none; }
.leaflet-zoom-animated {
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

/* ---- 选中区域：行军蚁仅沿真实区域边界流动 ---- */
.fp-region.is-active { animation: regionMarch 1.2s linear infinite; }
@keyframes regionMarch { to { stroke-dashoffset: -12; } }

/* 兜底：不让浏览器为 SVG 路径绘制外接矩形焦点框。 */
.leaflet-pane > svg path.leaflet-interactive:focus { outline: none; }

/* ---- 缩放控件（紧凑版 26px，纸面主题） ---- */
.leaflet-bar { border: none; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 12px rgba(9,25,38,.26); }
.leaflet-control-zoom a {
  width: 26px; height: 26px; line-height: 26px;
  background: var(--paper); color: var(--ink-3);
  border: none; font-size: 14px;
  transition: background .2s ease;
}
.leaflet-control-zoom a:hover { background: var(--paper-2); color: var(--red); }
.leaflet-control-attribution {
  background: rgba(248,246,240,.78);
  font-family: var(--font-mono); font-size: 9px; color: #55636e;
  backdrop-filter: blur(2px);
}
.leaflet-control-scale-line {
  background: rgba(248,246,240,.7);
  border-color: #33465a; color: #33465a;
  font-family: var(--font-mono); font-size: 9px;
}

.leaflet-tooltip.fp-tip {
  background: var(--ink-2); color: #f0ecdf;
  border: 1px solid rgba(217,179,106,.5);
  border-radius: 8px;
  padding: 7px 11px;
  font-family: var(--font-body); font-size: 12px;
  box-shadow: 0 8px 20px rgba(6,20,32,.35);
}
.leaflet-tooltip.fp-tip b {
  display: block;
  font-family: var(--font-display); font-weight: 400;
  font-size: 14px; letter-spacing: .06em;
}
.leaflet-tooltip.fp-tip span {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .08em; color: var(--gold);
}
.leaflet-tooltip-top.fp-tip::before { border-top-color: var(--ink-2); }

/* ---- 蓝色脉冲打卡点 ---- */
.leaflet-marker-icon.fp-dot-wrap { background: none; border: none; cursor: pointer; }
.fp-dot { position: relative; display: block; width: 22px; height: 22px; }
.fp-dot-core {
  position: absolute; inset: 5px; border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, #7db4ff, var(--blue) 62%, #155bb8);
  box-shadow: 0 0 0 2.5px #fff, 0 2px 8px rgba(13,45,90,.55);
  transition: transform .25s cubic-bezier(.2,.9,.3,1.4);
}
.fp-dot-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid rgba(29,111,209,.75);
  animation: dotPulse 2.4s ease-out infinite;
  animation-delay: var(--dot-delay, 0s);
}
.fp-dot-wrap:hover .fp-dot-core { transform: scale(1.4); }
@keyframes dotPulse {
  0%   { transform: scale(.45); opacity: .95; }
  70%  { transform: scale(1.9); opacity: 0; }
  100% { transform: scale(1.9); opacity: 0; }
}

/* ---- 航线虚线流动 + 小飞机 ---- */
.fp-flight { animation: fpDash 1.1s linear infinite; }
@keyframes fpDash { to { stroke-dashoffset: -11; } }
.leaflet-marker-icon.fp-plane-wrap { background: none; border: none; }
.fp-plane {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  filter: drop-shadow(0 3px 5px rgba(9,30,50,.4));
  /* 方位由 requestAnimationFrame 连续更新，不叠加 CSS 过渡以免产生拖影。 */
  transition: none;
  will-change: transform;
}
.fp-plane svg { width: 20px; height: 20px; fill: var(--paper); stroke: var(--ink-3); stroke-width: 1.1; }

/* 地图飞行时暂缓装饰层重绘，避免它们与 Leaflet 的视图变换相互叠加而闪烁。 */
.leaflet-container.is-moving .fp-region.is-active,
.leaflet-container.is-moving .fp-flight { animation-play-state: paused; }
.leaflet-container.is-moving .fp-dot-wrap:hover .fp-dot-core { transform: none; }

/* ---- 地图浮层：重置按钮 & 图例 ---- */
.map-reset {
  position: absolute; top: 14px; left: 14px; z-index: 500;
  padding: 9px 16px;
  border: none; border-radius: 999px;
  background: var(--paper); color: var(--ink-3);

  box-shadow: 0 6px 18px rgba(9,25,38,.28);
  cursor: pointer;
  transition: transform .22s ease, box-shadow .22s ease, color .22s ease;
}
.map-reset:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(9,25,38,.34); color: var(--red); }
.map-legend {
  position: absolute; right: 14px; bottom: 26px; z-index: 500;
  width: 176px; padding: 12px 14px;
  background: rgba(248,246,240,.93);
  border-radius: 10px;
  box-shadow: 0 8px 22px rgba(9,25,38,.24);
  backdrop-filter: blur(3px);
}
.map-legend h3 {
  margin: 0 0 8px;
  font-family: var(--font-display); font-weight: 400;
  font-size: 14px; letter-spacing: .14em;
}
.legend-list { list-style: none; margin: 0; padding: 0; }
.legend-list li { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 11px; color: #44525e; }
.lg-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 0 2px #fff, 0 0 6px rgba(29,111,209,.7);
}
.lg-line { width: 22px; border-top: 2px dashed var(--blue); }
#legendRegions { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.lg-region { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 11px; color: #44525e; }
.lg-region i { width: 10px; height: 10px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }

/* ==================== Instax Wide 弹窗（大画幅） ==================== */
.instax-overlay {
  position: fixed; inset: 0; z-index: 2000;
  display: grid; place-items: center;
  visibility: hidden;
  transition: visibility 0s .35s;
}
.instax-overlay.open { visibility: visible; transition: visibility 0s 0s; }
/* 弹窗打开时，禁止 body 滚动，防止侧边栏内容自动向上滑动 */
body.modal-open { overflow: hidden; }
.instax-backdrop {
  position: absolute; inset: 0;
  background: rgba(7,18,28,.66);
  backdrop-filter: blur(4px) saturate(.9);
  opacity: 0; transition: opacity .35s ease;
  cursor: zoom-out;
}
.instax-overlay.open .instax-backdrop { opacity: 1; }

.instax-count {
  position: absolute; top: 22px; left: 24px; z-index: 6;
  padding: 6px 14px; border-radius: 999px;
  background: rgba(13,35,52,.55);
  border: 1px solid rgba(217,179,106,.35);
  color: rgba(244,240,228,.9);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .3em;
  opacity: 0; transform: translateY(-8px);
  transition: opacity .35s ease .1s, transform .35s ease .1s;
}
.instax-overlay.open .instax-count { opacity: 1; transform: translateY(0); }

.instax-hint {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  margin: 0; white-space: nowrap;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .24em;
  color: rgba(244,240,228,.5);
  opacity: 0; transition: opacity .4s ease .35s;
}
.instax-overlay.open .instax-hint { opacity: 1; }

.instax-stage {
  position: relative; z-index: 5;
  display: flex; justify-content: center;
  padding: 20px;
}

/* 拍立得卡片：横版 Instax Wide 内容区 99×62，竖版 Instax Mini 内容区 46×62 */
.instax-card {
  --tilt: 0deg;
  --card-width: min(92vw, 960px);
  position: relative; margin: 0;
  width: var(--card-width);
  background: #fdfdfa;
  border-radius: 8px;
  padding: 20px 20px 0;
  box-shadow: 0 30px 70px rgba(4,14,24,.52), inset 0 2px 0 rgba(255,255,255,.65);
  transform: rotate(var(--tilt));
}
.instax-card.is-portrait {
  --card-width: min(56vw, 560px);
}
.instax-card.is-landscape {
  --card-width: min(92vw, 960px);
}
.instax-card.drop { animation: cardDrop .55s cubic-bezier(.18,.9,.26,1.15) both; }
@keyframes cardDrop {
  0%   { transform: translateY(-48px) rotate(calc(var(--tilt) - 5deg)) scale(.92); opacity: 0; }
  60%  { transform: translateY(4px)  rotate(calc(var(--tilt) + 1deg)) scale(1.01); opacity: 1; }
  100% { transform: translateY(0)    rotate(var(--tilt)) scale(1); }
}
.instax-tape {
  position: absolute; top: -13px; left: 50%;
  width: 108px; height: 28px;
  transform: translateX(-50%) rotate(-3deg);
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.28) 0 4px, transparent 4px 8px),
    rgba(224,159,62,.5);
  opacity: .9;
}
.instax-media {
  position: relative;
  aspect-ratio: 99 / 62;
  background: #0d1720;
  border-radius: 3px; overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
  -webkit-touch-callout: none;
}
.instax-media.is-portrait { aspect-ratio: 46 / 62; }
.instax-media.is-landscape { aspect-ratio: 99 / 62; }
.instax-media.is-video { cursor: pointer; }
.instax-asset {
  width: 100%; height: 100%; object-fit: cover; display: block;
  -webkit-user-drag: none;
  user-select: none;
}
.instax-asset.developing { animation: develop 1.5s ease-out both; }
@keyframes develop {
  0%   { filter: brightness(2.1) contrast(.35) saturate(.15); opacity: .25; }
  55%  { filter: brightness(1.25) contrast(.8) saturate(.7);  opacity: 1; }
  100% { filter: none; }
}
/* 视频暂停指示（无原生控制栏，点画面切换） */
.instax-vstate {
  position: absolute; inset: 0; margin: auto;
  width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(13,35,52,.62); color: var(--paper);
  font-size: 20px; padding-left: 4px;
  pointer-events: none;
  opacity: 0; transform: scale(.8);
  transition: opacity .3s ease, transform .3s ease;
}
.instax-vstate.is-paused { opacity: 1; transform: scale(1); }
.instax-noload {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  text-align: center; color: #93a7b4; font-size: 13px;
}
.instax-noload span { display: block; font-size: 34px; margin-bottom: 6px; }
.instax-noload small { display: block; margin-top: 6px; font-family: var(--font-mono); font-size: 10px; opacity: .65; }

.instax-caption { position: relative; padding: 16px 8px 24px; min-height: 136px; }
.instax-cap-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.instax-name {
  margin: 0;
  font-family: var(--font-hand); font-weight: 400;
  font-size: 34px; line-height: 1.15; letter-spacing: .04em;
  color: #1d2b36;
}
.instax-stamp {
  flex: none;
  width: 56px; height: 56px;
  display: grid; place-items: center;
  border: 2px solid var(--red);
  outline: 1px solid var(--red);
  outline-offset: 2px;
  border-radius: 50%;
  color: var(--red);
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: .14em; line-height: 1.3; text-align: center;
  transform: rotate(10deg);
}
.instax-card.drop .instax-stamp { animation: stampHit .4s .45s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes stampHit {
  from { transform: rotate(10deg) scale(1.8); opacity: 0; }
  to   { transform: rotate(10deg) scale(1);   opacity: .85; }
}
.instax-meta {
  display: flex; flex-wrap: wrap; gap: 4px 16px;
  margin-top: 8px;
  font-family: var(--font-mono); font-size: 11.5px;
  letter-spacing: .1em; color: #6b7a86;
}
.instax-meta b { color: #33465a; font-weight: 600; }
.instax-note {
  margin: 12px 0 0;
  font-family: var(--font-hand);
  font-size: 21px; line-height: 1.5;
  color: #3c4c5a;
}

/* 矮屏适配 */
@media (max-height: 760px) {
  .instax-card { width: var(--card-width, min(82vw, 660px)); }
  .instax-card.is-portrait { --card-width: min(48vw, 480px); }
  .instax-card.is-landscape { --card-width: min(82vw, 660px); }
  .instax-caption { min-height: 118px; padding: 12px 6px 20px; }
  .instax-name { font-size: 28px; }
  .instax-note { font-size: 18px; }
}

/* ==================== Toast ==================== */
.toast {
  position: fixed; bottom: 26px; left: 50%; z-index: 2600;
  transform: translateX(-50%) translateY(14px);
  padding: 10px 20px; border-radius: 999px;
  background: var(--ink-2); color: #f0ecdf;
  border: 1px solid rgba(217,179,106,.4);
  font-size: 12.5px; letter-spacing: .04em;
  box-shadow: 0 10px 26px rgba(4,14,24,.45);
  opacity: 0; pointer-events: none;
  transition: opacity .35s ease, transform .35s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ==================== 响应式：移动端底部抽屉 ==================== */
@media (max-width: 900px) {
  body { display: block; }
  .map-wrap { position: fixed; inset: 0; z-index: 0; }

  .sidebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1200;

    box-shadow: 0 -14px 40px rgba(4,14,24,.45);

    flex-direction: column;

  .sidebar.expanded { max-height: 58dvh; }

  .sidebar.expanded-full { max-height: 82dvh; }
  .sidebar::before { display: none; }

  .sheet-handle {
    display: block; flex: none;
    width: 100%; height: 42px;
    border: none; background: transparent; cursor: pointer;
    position: relative;
    flex-shrink: 0;
  }
  .sheet-handle::before {
    content: ""; position: absolute; top: 16px; left: 50%;
    width: 46px; height: 5px; margin-left: -23px;
    border-radius: 99px;
    background: rgba(236,231,219,.35);
    transition: transform .3s ease;
  }
  .sidebar.expanded .sheet-handle::before,
  .sidebar.expanded-full .sheet-handle::before {
    transform: rotate(180deg);
  }

  .side-head { 
    padding: 4px 18px 14px;
    flex: none;
  }
  .head-top { gap: 12px; margin-bottom: 14px; }
  .overline { font-size: 9px; margin-bottom: 3px; }
  .overline-sub { font-size: 13px; letter-spacing: .16em; }
  .stat-num { font-size: 21px; }

  .side-block { 
    padding: 10px 16px 2px;
    flex: none;
  }
  /* 区域选择区块：只在第一段展开和完全展开时显示 */
  #regionBlock { display: none; }
  .sidebar.expanded #regionBlock,
  .sidebar.expanded-full #regionBlock { display: block; }
  .block-title { margin-bottom: 8px; font-size: 12px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; }

  /* 时间线区块：默认收起，完全展开时才显示完整内容 */
  .side-block--grow { 
    flex: 0 0 auto;
    max-height: 0;
    overflow: hidden;
    padding: 0 16px;
    opacity: 0;
    transition: max-height .4s cubic-bezier(.2,.9,.3,1), opacity .3s ease, padding .3s ease;
  }
  .sidebar.expanded-full .side-block--grow {
    flex: 1 1 auto;
    max-height: none;
    overflow-y: auto;
    padding: 10px 16px 4px;
    opacity: 1;
  }
  .tl-list {
    display: flex; flex-direction: row; gap: 12px;
    padding: 4px 2px 16px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .tl-list::-webkit-scrollbar { display: none; }
  .tl-list::before { display: none; }
  .sidebar.expanded-full .tl-list {
    flex-direction: column;
    overflow-y: auto; overflow-x: hidden;
    padding-left: 22px;
  }
  .sidebar.expanded-full .tl-list::before { display: block; }
  .tl-item { flex: 0 0 250px; margin: 0; scroll-snap-align: start; opacity: 1; transform: none; }
  .sidebar.expanded-full .tl-item { flex: none; width: auto; margin-bottom: 14px; }
  .tl-node { display: none; }
  .sidebar.expanded-full .tl-node { display: block; }

  .map-legend { display: none; }
  .leaflet-control-attribution, .leaflet-control-scale { display: none; }
  .map-reset { top: 12px; left: 12px; padding: 8px 13px; font-size: 12px; }
}

@media (max-width: 640px) {
  .instax-stage { padding: 14px; }
  .instax-card { width: var(--card-width, min(96vw, 760px)); padding: 13px 13px 0; }
  .instax-card.is-portrait { --card-width: min(72vw, 520px); }

  .instax-name { font-size: 26px; }
  .instax-note { font-size: 17px; }
  .instax-caption { min-height: 112px; padding: 12px 5px 20px; }
  .instax-stamp { width: 48px; height: 48px; font-size: 8px; }
  .instax-hint { font-size: 9px; letter-spacing: .18em; bottom: 12px; }
}

/* 小屏手机进一步适配 */
@media (max-width: 400px) {
  .instax-card { width: var(--card-width, min(98vw, 680px)); padding: 11px 11px 0; }
  .instax-card.is-portrait { --card-width: min(80vw, 460px); }
  .instax-card.is-landscape { --card-width: min(98vw, 680px); }
  .instax-name { font-size: 22px; }
  .instax-note { font-size: 15px; }
  .instax-caption { min-height: 96px; padding: 10px 4px 16px; }
  .instax-stamp { width: 42px; height: 42px; font-size: 7px; }
}

/* 尊重系统减弱动效 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* 强制启用脉冲点和飞机动画，即使用户系统设置减弱动效 */
.fp-dot-ring, .fp-flight, .loader-orbit {
  animation-play-state: running !important;
}

  function decodeTopoCountries(topo) {

  const GCJ_A = 6378245.0, GCJ_EE = 0.00669342162296594323;

      return correctGeoJSON(await res.json());          /* GCJ-02 → WGS-84 */
    }
    if (def.geo && def.geo.type === 'world') {
      const fc = await getWorldFeatures();              /* Natural Earth 1:50m · WGS-84 */
      const feat = fc.features.find((f) => String(f.id) === String(def.geo.id));
      if (!feat) throw new Error('未找到边界要素 id=' + def.geo.id);
      return feat;
    }
    throw new Error('未知 geo 类型');
  }

  /* ---------------- 5. 地图初始化 ---------------- */
  function initMap() {
    const map = L.map('map', {
      zoomControl: false, minZoom: 3, maxZoom: 17,
      worldCopyJump: true, attributionControl: false,
      fadeAnimation: false, markerZoomAnimation: false
    });
    /* 飞行缩放期间复用当前瓦片，等视图稳定后再更新，防止中间层频繁淡入淡出。 */
    L.tileLayer(TILE_URL, {
      attribution: TILE_ATTR, subdomains: 'abcd', maxZoom: 19,
      updateWhenZooming: false, updateWhenIdle: true, keepBuffer: 4
    }).addTo(map);
    
    map.on('movestart', () => {
      state.isMapMoving = true;
      map.getContainer().classList.add('is-moving');
    });
    map.on('moveend', () => {
      // 使用 setTimeout 确保 moveend 事件完全处理后再设置状态
      setTimeout(() => {
        state.isMapMoving = false;
        map.getContainer().classList.remove('is-moving');
      }, 0);
    });
    // 监听缩放动画事件，确保 flyTo 等缩放操作也能正确更新状态
    map.on('zoomanim', () => {
      state.isMapMoving = true;
      map.getContainer().classList.add('is-moving');
    });
    map.on('zoomend', () => {
      // 使用 setTimeout 确保 zoomend 事件完全处理后再设置状态
      setTimeout(() => {
        state.isMapMoving = false;
        map.getContainer().classList.remove('is-moving');
      }, 0);
    });
    
    state.map = map;
  }

  /* ---------------- 6. GeoJSON 区域高亮（异步，不阻塞首屏） ---------------- */
  function registerRegions(defs) {
    defs.forEach((def) => state.regions.set(def.id, { def, layer: null }));
  }

  function createRegionLayer(def, gj) {
    return L.geoJSON(gj, {
      className: 'fp-region',
      /* 点击区域不应抢占焦点，避免浏览器在 SVG 外接矩形上绘制默认黑白边框。 */
      keyboard: false,
      style: Object.assign({ color: def.color, fillColor: def.color }, BASE_STYLE),
      onEachFeature: (f, lyr) => {
        lyr.on({
          click: () => focusRegion(def.id),
          mouseover: () => setRegionStyle(def.id, HOVER_STYLE),
          mouseout: () => setRegionStyle(def.id, state.activeRegion === def.id ? ACTIVE_STYLE : BASE_STYLE)
        });
        lyr.bindTooltip(`<b>${def.name}</b><span>${def.scope || ''}</span>`, {
          className: 'fp-tip', sticky: true, direction: 'top'
        });
      }
    }).addTo(state.map);
  }

  function loadRegionsAsync(defs) {
    const retrySet = new Set();
    Promise.allSettled(defs.map(async (def) => {
      const rec = state.regions.get(def.id);
      if (!rec) return;
      try {
        const gj = await fetchRegionGeoJSON(def);
        rec.layer = createRegionLayer(def, gj);
        /* 边界到达时若该区域恰为选中态，补齐行军蚁样式。 */
        if (state.activeRegion === def.id) {
          setRegionStyle(def.id, ACTIVE_STYLE);
          setRegionActiveClass(def.id, true);
        }
      } catch (err) {
        console.warn(`[footprint] 区域 ${def.name} 边界加载失败:`, err);
        retrySet.add(def);
        // 第一次失败后尝试重试一次
        try {
          const gj = await fetchRegionGeoJSON(def);
          rec.layer = createRegionLayer(def, gj);
          retrySet.delete(def);
        } catch (retryErr) {
          console.warn(`[footprint] 区域 ${def.name} 重试仍失败`);
        }
      }
    })).then(() => {
      const failed = retrySet.size;
      if (failed > 0) {
        console.warn('[footprint] 部分区域边界最终加载失败');
        toast(`${failed} 个区域边界加载失败，点击 chips 仍可定位`);
      }
    });
  }

  function setRegionStyle(id, style) {
    const rec = state.regions.get(id);
    if (rec && rec.layer) rec.layer.setStyle(style);
  }

  function setRegionActiveClass(id, on) {
    const rec = state.regions.get(id);
    if (!rec || !rec.layer) return;
    rec.layer.eachLayer((lyr) => {
      const pathEl = lyr.getElement && lyr.getElement();
      if (pathEl) pathEl.classList.toggle('is-active', on);
    });
  }

  function focusRegion(id) {
    const rec = state.regions.get(id);
    if (!rec) return;
    state.activeRegion = id;
    state.regions.forEach((r, rid) => {
      setRegionStyle(rid, rid === id ? ACTIVE_STYLE : BASE_STYLE);
      setRegionActiveClass(rid, rid === id);
      // 关闭所有区域的 tooltip 提示
      if (r.layer) {
        r.layer.eachLayer((lyr) => {
          if (lyr.closeTooltip) lyr.closeTooltip();
        });
      }
    });
    syncChips();
    if (rec.layer) {
      state.map.flyToBounds(rec.layer.getBounds(), { padding: [60, 60], duration: .9 });
    } else if (rec.def.fallbackView) {
      state.map.flyTo(rec.def.fallbackView.center, rec.def.fallbackView.zoom, { duration: .9 });
    }
  }

  function resetView() {
    state.activeRegion = null;
    state.regions.forEach((r, rid) => {
      setRegionStyle(rid, BASE_STYLE);
      setRegionActiveClass(rid, false);
      // 关闭所有区域的 tooltip 提示
      if (r.layer) {
        r.layer.eachLayer((lyr) => {
          if (lyr.closeTooltip) lyr.closeTooltip();
        });
      }
    });
    syncChips();
    if (state.allBounds) state.map.flyToBounds(state.allBounds, { duration: .9 });
  }

  function syncChips() {
    document.querySelectorAll('#chipList .chip').forEach((c) => {
      const rid = c.dataset.region || null;
      c.classList.toggle('is-active', rid === state.activeRegion || (!rid && !state.activeRegion));
    });
  }

  /* ---------------- 7. 蓝色脉冲打卡点 ---------------- */
  function buildSpots() {
    const pts = [];
    state.spots.forEach((spot, idx) => {
      const icon = L.divIcon({
        className: 'fp-dot-wrap',
        html: `<span class="fp-dot" style="--dot-delay:${(idx * 0.35).toFixed(2)}s">
                 <span class="fp-dot-ring"></span><span class="fp-dot-core"></span>
               </span>`,
        iconSize: [22, 22], iconAnchor: [11, 11]
      });
      const mk = L.marker([spot.lat, spot.lng], { icon, riseOnHover: true, alt: spot.name }).addTo(state.map);
      mk.bindTooltip(`<b>${idx + 1}. ${spot.name}</b><span>${spot.date} · 点击查看</span>`, {
        className: 'fp-tip', direction: 'top', offset: [0, -10]
      });
      mk.on('click', () => gotoSpot(spot.id));
      state.spotMarkers[spot.id] = mk;
      pts.push([spot.lat, spot.lng]);
    });
    state.allBounds = L.latLngBounds(pts).pad(0.12);
    state.map.fitBounds(state.allBounds);
  }

  function gotoSpot(id) {
    const idx = state.spots.findIndex((s) => s.id === id);
    if (idx < 0) return;
    const spot = state.spots[idx];
    markCurrent(id);
    const target = L.latLng(spot.lat, spot.lng);
    const targetZoom = spot.zoom || 9;
    // 清理之前的 moveend 监听器，避免重复触发
    if (state._openAfterMove) {
      state.map.off('moveend', state._openAfterMove);
      state._openAfterMove = null;
    }
    state._openAfterMove = () => {
      state._openAfterMove = null;
      openInstax(idx);
    };
    if (state.map.getCenter().equals(target) && state.map.getZoom() === targetZoom) {
      state._openAfterMove();
    } else {
      state.map.once('moveend', state._openAfterMove);
      state.map.flyTo(target, targetZoom, { duration: .95, easeLinearity: .25 });
    }
  }

  function markCurrent(id) {
    const cur = document.querySelector('.tl-item.is-current');
    if (cur) cur.classList.remove('is-current');
    const node = document.querySelector(`.tl-item[data-id="${id}"]`);
    if (node) {
      node.classList.add('is-current');
      node.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    }
  }

  /* ---------------- 8. 行程航线 + 巡航小飞机 ---------------- */
  function buildFlightPath() {
    const seq = state.spots.map((s) => ({ lat: s.lat, lng: s.lng }));
    if (seq.length < 2) return;
    const path = [];
    for (let i = 0; i < seq.length - 1; i++) {
      const a = seq[i], b = seq[i + 1], n = 26;
      const mx = (a.lng + b.lng) / 2, my = (a.lat + b.lat) / 2;
      const dx = b.lng - a.lng, dy = b.lat - a.lat;
      const len = Math.hypot(dx, dy) || 1;
      const side = i % 2 === 0 ? 1 : -1;
      const off = Math.min(len * 0.22, 6) * side;
      const cx = mx + (-dy / len) * off, cy = my + (dx / len) * off;
      for (let k = 0; k <= n; k++) {
        const t = k / n;
        path.push([
          (1 - t) * (1 - t) * a.lat + 2 * (1 - t) * t * cy + t * t * b.lat,
          (1 - t) * (1 - t) * a.lng + 2 * (1 - t) * t * cx + t * t * b.lng
        ]);
      }
    }
    state.planePath = path;
    L.polyline(path, { className: 'fp-flight-glow', color: '#1d6fd1', weight: 7, opacity: .10, lineCap: 'round', interactive: false }).addTo(state.map);
    L.polyline(path, { className: 'fp-flight', color: '#1d6fd1', weight: 2, opacity: .65, dashArray: '2 9', lineCap: 'round', interactive: false }).addTo(state.map);
    // 等待地图初始化完成后再启动飞机动画
    setTimeout(startPlane, 100);
  }

  function startPlane() {
    if (!state.planePath.length) return;
    if (state.planeFrame) cancelAnimationFrame(state.planeFrame);
    if (state.planeMarker) state.map.removeLayer(state.planeMarker);

    const icon = L.divIcon({
      className: 'fp-plane-wrap',
      html: `<div class="fp-plane"><svg viewBox="0 0 24 24" aria-hidden="true">
               <path d="M22 16v-2l-8.5-5V3.5C13.5 2.67 12.83 2 12 2s-1.5.67-1.5 1.5V9L2 14v2l8.5-2.5V19L8 20.5V22l4-1 4 1v-1.5L13.5 19v-5.5L22 16z"/>
      </svg></div>`,
      iconSize: [26, 26], iconAnchor: [13, 13]
    });
    const mk = L.marker(state.planePath[0], { icon, interactive: false, keyboard: false }).addTo(state.map);
    state.planeMarker = mk;
    
    // 调试日志：确认飞机标记已创建
    console.log('[footprint] 飞机标记已创建，路径点数:', state.planePath.length);
    
    if (!ENABLE_ANIMATIONS) return;

    /* 单一 requestAnimationFrame 时钟：位置和朝向同帧更新，避免 CSS 过渡叠加拖影。 */
    const DURATION = 48000;
    let elapsed = 0;
    let previous = performance.now();
    let debugFrameCount = 0;
    (function frame(now) {
      const delta = Math.min(now - previous, 50);
      previous = now;
      debugFrameCount++;
      
      /* 视图移动时，飞机与其内部旋转同时冻结；地图稳定后从原位置继续。 */
      if (!state.isMapMoving) {
        elapsed = (elapsed + delta) % DURATION;
        const t = elapsed / DURATION;
        const f = t * (state.planePath.length - 1);
        const i = Math.floor(f), frac = f - i;
        const p1 = state.planePath[i];
        const p2 = state.planePath[Math.min(i + 1, state.planePath.length - 1)];
        mk.setLatLng([p1[0] + (p2[0] - p1[0]) * frac, p1[1] + (p2[1] - p1[1]) * frac]);
        const el = mk.getElement();
        const node = el && el.querySelector('.fp-plane');
        if (node) {
          const brg = bearing({ lat: p1[0], lng: p1[1] }, { lat: p2[0], lng: p2[1] });
          node.style.transform = `rotate(${brg.toFixed(1)}deg)`;
        }
        // 每 60 帧打印一次调试信息
        if (debugFrameCount % 60 === 0) {
          console.log('[footprint] 飞机动画运行中，isMapMoving:', state.isMapMoving, 'elapsed:', elapsed);
        }
      } else {
        // 每 30 帧打印一次等待信息
        if (debugFrameCount % 30 === 0) {
          console.log('[footprint] 等待地图静止，isMapMoving:', state.isMapMoving);
        }
      }
      state.planeFrame = requestAnimationFrame(frame);
    })(previous);
  }

  /* ---------------- 9. 侧栏渲染（统计 / chips / 时间线） ---------------- */

      );

      let orientationClass = 'is-portrait'; // 默认竖版

    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {

    }, { threshold: .12 });
    document.querySelectorAll('.tl-item').forEach((n) => io.observe(n));

  /* ---------------- 10. Instax Wide 弹窗（大画幅 · 无可见控件） ---------------- */
  let currentPhotoIndex = 0;
  
  // 辅助函数：获取地点的媒体类型（支持旧的 media 字段和新的 mediaType 字段）
  function getMediaType(spot) {
    return spot.mediaType || spot.media || 'photo';
  }
  
  // 辅助函数：获取地点的视频源
  function getVideoSrc(spot) {
    return spot.videoSrc || spot.src || '';
  }
  
  // 辅助函数：获取地点的海报图
  function getPosterSrc(spot) {
    return spot.poster || (spot.photos && spot.photos.length > 0 ? spot.photos[0] : '');
  }
  
  // 辅助函数：获取地点的照片列表
  function getPhotos(spot) {
    if (spot.photos && spot.photos.length > 0) {
      return spot.photos;
    }
    if (spot.src) {
      return [spot.src];
    }
    return [];
  }
  
  function openInstax(idx, isNav = false) {
    state.modalIndex = (idx + state.spots.length) % state.spots.length;
    const spot = state.spots[state.modalIndex];
    const overlay = $('#instaxOverlay');
    const media = $('#instaxMedia');
    
    // 获取媒体类型和相关资源
    const mediaType = getMediaType(spot);
    const videoSrc = getVideoSrc(spot);
    const posterSrc = getPosterSrc(spot);
    const photos = getPhotos(spot);

    // 导航切换时保留视频状态，仅更新内容；首次打开则完全重置
    if (!isNav) {
      stopCurrentMedia();
      media.classList.remove('is-video');
      media.innerHTML = '';
      currentPhotoIndex = 0;
    }

    const tilt = ((state.modalIndex % 5) - 2) * 1.4;
    const cardEl = $('#instaxCard');
    cardEl.style.setProperty('--tilt', tilt.toFixed(1) + 'deg');
    
    // 监听媒体区域的方向变化，同步更新卡片的 is-portrait 类
    const observer = new MutationObserver(() => {
      if (media.classList.contains('is-portrait')) {
        cardEl.classList.add('is-portrait');
      } else {
        cardEl.classList.remove('is-portrait');
      }
    });
    observer.observe(media, { attributes: true, attributeFilter: ['class'] });
    
    // 初始化时同步一次方向状态
    if (media.classList.contains('is-portrait')) {
      cardEl.classList.add('is-portrait');
    } else {
      cardEl.classList.remove('is-portrait');
    }

    const totalPhotos = photos.length;

    // 如果是导航且已有媒体元素，只需更新 src，避免重建导致状态丢失
    let node;
    if (mediaType === 'video' || mediaType === 'mixed') {
      // 视频模式：检测视频海报图的方向
      const updateVideoOrientation = () => {
        if (posterSrc) {
          const posterImg = new Image();
          posterImg.src = previewImageUrl(posterSrc, IMAGE_VARIANT.modal);
          posterImg.onload = function() {
            media.classList.remove('is-portrait', 'is-landscape');
            if (this.width > this.height) {
              media.classList.add('is-landscape');
            } else {
              media.classList.add('is-portrait');
            }
          };
        }
      };
      
      if (isNav && media.querySelector('video')) {
        node = media.querySelector('video');
        node.pause();
        node.src = videoSrc;
        if (posterSrc) node.poster = previewImageUrl(posterSrc, IMAGE_VARIANT.modal);
        node.load();
        node.play().catch(() => {});
        updateVideoOrientation();
      } else {
        media.classList.remove('is-video', 'is-portrait', 'is-landscape');
        media.innerHTML = '';
        node = document.createElement('video');
        node.className = 'instax-asset developing';
        node.loop = true; node.muted = true;
        node.setAttribute('playsinline', '');
        node.setAttribute('preload', 'metadata');
        node.setAttribute('controlslist', 'nodownload');
        node.setAttribute('disablepictureinpicture', '');
        if (posterSrc) node.poster = previewImageUrl(posterSrc, IMAGE_VARIANT.modal);
        node.addEventListener('loadeddata', () => {
          node.classList.remove('developing');
          updateVideoOrientation();
        }, { once: true });
        node.addEventListener('error', () => mediaFailed(media), { once: true });
        node.src = videoSrc;

        const vstate = el('span', 'instax-vstate is-paused', '▶');
        media.appendChild(node);
        media.appendChild(vstate);
        media.classList.add('is-video');
        node.addEventListener('play',  () => vstate.classList.remove('is-paused'));
        node.addEventListener('pause', () => { vstate.textContent = '▶'; vstate.classList.add('is-paused'); });

        node.play().catch(() => {});
      }
    } else {
      // 照片模式：显示当前索引的照片，并检测方向
      const currentPhotoSrc = photos[currentPhotoIndex] || '';
      const updatePhotoOrientation = () => {
        const photoImg = new Image();
        photoImg.src = previewImageUrl(currentPhotoSrc, IMAGE_VARIANT.modal);
        photoImg.onload = function() {
          media.classList.remove('is-portrait', 'is-landscape');
          if (this.width > this.height) {
            media.classList.add('is-landscape');
          } else {
            media.classList.add('is-portrait');
          }
        };
      };
      
      if (isNav && media.querySelector('img')) {
        node = media.querySelector('img');
        node.src = previewImageUrl(currentPhotoSrc, IMAGE_VARIANT.modal);
        updatePhotoOrientation();
      } else {
        media.classList.remove('is-video', 'is-portrait', 'is-landscape');
        media.innerHTML = '';
        node = new Image();
        node.className = 'instax-asset developing';
        node.alt = spot.name;
        node.draggable = false;
        node.addEventListener('load', () => {
          node.classList.remove('developing');
          updatePhotoOrientation();
        }, { once: true });
        node.addEventListener('error', () => mediaFailed(media), { once: true });
        node.src = previewImageUrl(currentPhotoSrc, IMAGE_VARIANT.modal);
        media.appendChild(node);
      }
    }

    // 更新计数显示为照片序号和总数
    const photoLabel = totalPhotos > 1 ? `· ${currentPhotoIndex + 1}/${totalPhotos}` : '';
    $('#instaxName').textContent = spot.name;
    $('#instaxMeta').innerHTML =
      `<b>${spot.en}</b><span>${spot.date}</span><span>${spot.lat.toFixed(4)}°N, ${spot.lng.toFixed(4)}°E</span>`;
    $('#instaxNote').textContent = spot.note;
    $('#instaxCount').textContent = `${state.modalIndex + 1} / ${state.spots.length}${photoLabel}`;

    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');

    // 打开弹窗时自动收起侧边栏，避免在手机上遮挡地图内容
    const sb = $('#sidebar');
    if (sb) {
      sb.classList.remove('expanded');
      sb.classList.remove('expanded-full');
      const handle = $('.sheet-handle');
      if (handle) handle.setAttribute('aria-expanded', 'false');
    }

    const card = $('#instaxCard');
    card.classList.remove('drop');
    void card.offsetWidth;
    card.classList.add('drop');
  }

  function mediaFailed(box) {
    box.classList.remove('is-video');
    box.innerHTML = '<div class="instax-noload"><span>📷</span>影像暂时无法加载<small>请检查网络后重新打开</small></div>';
  }

  function stopCurrentMedia() {
    const v = $('#instaxMedia video');
    if (v) v.pause();
  }

  function closeInstax() {
    stopCurrentMedia();
    const overlay = $('#instaxOverlay');
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    state.modalIndex = -1;
    
    // 关闭弹窗时自动收起侧边栏，避免遮挡地图内容
    const sb = $('#sidebar');
    if (sb) {
      sb.classList.remove('expanded');
      sb.classList.remove('expanded-full');
      const handle = $('.sheet-handle');
      if (handle) handle.setAttribute('aria-expanded', 'false');
    }
  }

  function navInstax(dir) {
    if (state.modalIndex < 0) return;
    
    const spot = state.spots[state.modalIndex];
    const mediaType = getMediaType(spot);
    const photos = getPhotos(spot);
    const totalPhotos = photos.length;
    
    // 如果是照片模式或 mixed 模式且有多张照片，先切换照片
    if ((mediaType === 'photo' || mediaType === 'mixed') && totalPhotos > 1) {
      const newIndex = (currentPhotoIndex + dir + totalPhotos) % totalPhotos;
      if (newIndex !== currentPhotoIndex) {
        currentPhotoIndex = newIndex;
        openInstax(state.modalIndex, true);
        return;
      }
    }
    
    // 单张照片、视频模式，切换到下一个地点
    const prevIdx = state.modalIndex;
    const next = (state.modalIndex + dir + state.spots.length) % state.spots.length;
    if (next === prevIdx) return;
    
    const nextSpot = state.spots[next];
    state.map.flyTo([nextSpot.lat, nextSpot.lng], nextSpot.zoom || 9, { duration: .8 });
    markCurrent(nextSpot.id);
    openInstax(next, true);
  }

  function onMediaClick() {
    const v = $('#instaxMedia video');
    if (!v) return;
    if (v.paused) v.play().catch(() => {}); else v.pause();
  }
  
  /* 支持点击上下区域切换照片，左右区域切换地点 */
  function onInstaxOverlayClick(e) {
    const overlay = $('#instaxOverlay');
    if (!overlay.classList.contains('open')) return;
    
    const spot = state.spots[state.modalIndex];
    const mediaType = getMediaType(spot);
    const photos = getPhotos(spot);
    const isMultiPhoto = (mediaType === 'photo' || mediaType === 'mixed') && photos.length > 1;
    
    const rect = overlay.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;
    const thirdWidth = rect.width / 3;
    const thirdHeight = rect.height / 3;
    
    if (isMultiPhoto) {
      // 多张照片模式：点击上侧 1/3 区域切换到上一张，下侧 1/3 区域切换到下一张
      if (clickY < thirdHeight) {
        currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
        openInstax(state.modalIndex, true);
      } else if (clickY > rect.height - thirdHeight) {
        currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
        openInstax(state.modalIndex, true);
      }
    } else {
      // 单张照片或视频模式：点击左侧 1/3 区域切换到上一个地点，右侧 1/3 区域切换到下一个地点
      if (clickX < thirdWidth) {
        navInstax(-1);
      } else if (clickX > rect.width - thirdWidth) {
        navInstax(1);
      }
    }
  }

  /* ---------------- 11. 全局交互绑定 ---------------- */
  function bindUI() {
    $('#btnReset').addEventListener('click', resetView);
    $('#instaxMedia').addEventListener('click', onMediaClick);

    /* 影像保护：禁止右键另存 / 拖拽保存 */
    const guard = (e) => e.preventDefault();
    ['contextmenu', 'dragstart'].forEach((evt) => {
      $('#instaxMedia').addEventListener(evt, guard);
      $('#tlList').addEventListener(evt, guard);
    });

    const overlay = $('#instaxOverlay');
    overlay.querySelector('.instax-backdrop').addEventListener('click', closeInstax);
    overlay.addEventListener('click', onInstaxOverlayClick);

    window.addEventListener('keydown', (e) => {
      if (!overlay.classList.contains('open')) return;
      
      const spot = state.spots[state.modalIndex];
      const mediaType = getMediaType(spot);
      const photos = getPhotos(spot);
      const isMultiPhoto = (mediaType === 'photo' || mediaType === 'mixed') && photos.length > 1;
      
      if (e.key === 'Escape') {
        closeInstax();
      } else if (isMultiPhoto) {
        // 多张照片模式：上下方向键切换照片
        if (e.key === 'ArrowUp') {
          currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
          openInstax(state.modalIndex, true);
        } else if (e.key === 'ArrowDown') {
          currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
          openInstax(state.modalIndex, true);
        }
      } else {
        // 单张照片或视频模式：左右方向键切换地点
        if (e.key === 'ArrowRight') navInstax(1);
        else if (e.key === 'ArrowLeft') navInstax(-1);
      }
    });

    let touchX = null, touchY = null;
    overlay.addEventListener('touchstart', (e) => {
      touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
    }, { passive: true });
    overlay.addEventListener('touchend', (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      
      // 获取当前地点信息
      const spot = state.spots[state.modalIndex];
      const mediaType = getMediaType(spot);
      const photos = getPhotos(spot);
      const isMultiPhoto = (mediaType === 'photo' || mediaType === 'mixed') && photos.length > 1;
      
      // 多张照片模式：垂直滑动切换照片，水平滑动无效
      if (isMultiPhoto) {
        if (dy > 70 && Math.abs(dy) > Math.abs(dx)) {
          // 向下滑动切换到上一张
          currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
          openInstax(state.modalIndex, true);
        } else if (dy < -70 && Math.abs(dy) > Math.abs(dx)) {
          // 向上滑动切换到下一张
          currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
          openInstax(state.modalIndex, true);
        }
      } else {
        // 单张照片或视频模式：垂直滑动关闭，水平滑动切换地点
        if (dy > 70 && Math.abs(dy) > Math.abs(dx)) closeInstax();
        else if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy)) navInstax(dx < 0 ? 1 : -1);
      }
      
      touchX = touchY = null;
    }, { passive: true });

    const handle = $('.sheet-handle');
    if (handle) {
      handle.addEventListener('click', () => {
        const sb = $('#sidebar');
        // 三段式展开逻辑：收起 -> 第一段展开（显示区域 chips）-> 第二段展开（显示时间线）-> 收起
        if (!sb.classList.contains('expanded')) {
          // 从收起状态到第一段展开
          sb.classList.add('expanded');
          sb.classList.remove('expanded-full');
        } else if (!sb.classList.contains('expanded-full')) {
          // 从第一段展开到完全展开
          sb.classList.add('expanded-full');
        } else {
          // 从完全展开到收起
          sb.classList.remove('expanded');
          sb.classList.remove('expanded-full');
        }
        handle.setAttribute('aria-expanded', String(sb.classList.contains('expanded') || sb.classList.contains('expanded-full')));
      });
    }
  }

  /* ---------------- 12. 启动（含失败兜底） ---------------- */
  function hideLoader() {
    const l = $('#loader');
    l.classList.add('done');
    setTimeout(() => l.remove(), 700);
    if (window.__FP_OFFLINE__) {
      setTimeout(() => toast('提示：未通过本地服务加载 data.json，已使用内置数据'), 900);
    }
  }

  function fatal(err) {
    console.error('[footprint] 页面启动失败：', err);
    const l = $('#loader');
    if (!l) return;
    l.classList.add('error');
    const txt = l.querySelector('.loader-text');
    const sub = l.querySelector('.loader-sub');
    if (txt) txt.textContent = '地图加载失败，请检查网络后重试';
    if (sub) sub.textContent = 'ERROR · ' + (err && err.message ? String(err.message).slice(0, 60) : 'UNKNOWN');
  }

  async function boot() {
    if (typeof L === 'undefined') throw new Error('Leaflet 未能加载（底图库 CDN 不可达）');
    const data = await loadData();
    state.spots = (data.spots || []).slice().sort((a, b) => a.date.localeCompare(b.date));
    registerRegions(data.regions || []);   /* 先注册定义：chips / 图例立即可用 */
    initMap();
    buildSpots();
    buildFlightPath();
    renderSidebar();
    bindUI();
    hideLoader();
    loadRegionsAsync(data.regions || []);  /* 边界后台加载，互不阻塞 */
  }

  /* 入口：等待 Leaflet 动态加载完成后启动，超时则展示错误页 */
  const start = () => waitForLeaflet(28000).then(boot).catch(fatal);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();


              </script>
                        </body>
                        </html>
