<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>个人旅行足迹地图 | My Travel Footprint Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    
    <!-- Google Fonts - 手写字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 地图容器 -->
    <div id="map"></div>
    
    <!-- 左上角返回 Logo (与全站统一) -->
    <a href="/" class="logo" title="返回主页 / HOME" aria-label="返回主页">
        <svg viewBox="404 343 494 614" xmlns="http://www.w3.org/2000/svg"
             style="shape-rendering:geometricPrecision;text-rendering:geometricPrecision;image-rendering:optimizeQuality;fill-rule:evenodd;clip-rule:evenodd"
             aria-hidden="true" focusable="false">
            <path fill="currentColor" stroke="none" d="M414.99 453c0-33.17.01-66.34.03-99.5.66-5.09 3.49-8.21 8.49-9.39 150.66-.11 301.32-.15 451.99-.11 6.68.13 10.89 4.85 10.51 11.5 0 33.34-.01 66.67-.03 100-1.1 6.44-4.93 9.61-11.48 9.51q-225 0-450-.03c-6.59-.74-9.91-5.5-9.51-11.98Zm2 196c0-33.17.01-66.34.03-99.5.66-5.09 3.49-8.21 8.49-9.39 149.99-.11 299.99-.15 449.99-.11 6.68.13 10.89 4.85 10.51 11.5 0 33.34-.01 66.67-.03 100-1.1 6.44-4.93 9.61-11.48 9.51-149.34 0-298.67-.01-448-.03-6.59-.74-9.91-5.5-9.51-11.98Zm239.17 30.05c-.11-1.19 1.6-1.03 2.32-1.06q67.515.015 135.03 0c.87.01 1.71.16 2.51.47 18.52 9.86 20.19 26.4 23.75 45.05 5.25 31.78 9.94 63.37 16.99 94.82-.61.6-1.36.83-2.24.68-51.26.06-102.51-.05-153.75-.31-.38-.32-.58-.74-.58-1.24-5.6-46.04-15.62-92.72-24.03-138.41ZM416.99 944c0-32.84.01-65.67.03-98.5.66-5.09 3.49-8.21 8.49-9.39 149.99-.11 299.99-.15 449.99-.11 6.68.13 10.89 4.85 10.51 11.5q0 49.5-.03 99c-1.1 6.44-4.93 9.61-11.48 9.51-149.34 0-298.67-.01-448-.03-6.59-.74-9.91-5.5-9.51-11.98Z"/>
        </svg>
    </a>
    
    <!-- 照片弹窗 Modal (拍立得样式) -->
    <div class="modal-overlay" id="photoModal" aria-hidden="true">
        <div class="polaroid-frame">
            <button class="modal-close" id="modalClose" aria-label="关闭弹窗">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
            <div class="polaroid-photo">
                <img id="modalImage" src="" alt="旅行照片">
            </div>
            <div class="polaroid-info">
                <h2 id="modalTitle" class="polaroid-title"></h2>
                <p id="modalDate" class="polaroid-date"></p>
                <p id="modalDesc" class="polaroid-desc handwritten"></p>
            </div>
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    
    <!-- App Logic -->
    <script src="js/app.js"></script>
</body>
</html>
