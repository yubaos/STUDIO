<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footprint Map - 个人旅行足迹地图</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 地图容器 -->
    <div id="map"></div>
    
    <!-- 照片弹窗 Modal (Instax Wide 比例) -->
    <div id="photoModal" class="modal-overlay" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close" aria-label="关闭弹窗">&times;</button>
            <div class="instax-frame">
                <div class="instax-photo">
                    <img id="modalImage" src="" alt="">
                </div>
                <div class="instax-caption">
                    <h2 id="modalName"></h2>
                    <p class="modal-location" id="modalLocation"></p>
                    <p class="modal-date" id="modalDate"></p>
                    <p class="modal-description" id="modalDescription"></p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    
    <!-- App Logic -->
    <script src="js/app.js"></script>
</body>
</html>
