<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FOOTPRINTS — 旅行票根档案</title>
<!-- 字体：等宽打字机 + 旧打字机标题，贴合票根 / 旧车票质感 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono@5.0.18/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono@5.0.18/700.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/special-elite@5.0.18/400.css" rel="stylesheet">
<style>
    :root{
        --paper:#e9e4da;          /* 票根纸张色 */
        --ink:#262420;            /* 主墨色 */
        --ink-soft:#6b665c;       /* 次墨色 */
        --wall:#c4c2bc;           /* 墙面底色（中灰） */
        --notch:7px;              /* 票根缺口半径 */
        --notch-lg:12px;          /* 放大票根缺口半径 */
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}

    body{
        font-family:'Space Mono', monospace;
        background-color:var(--wall);
        color:var(--ink);
        min-height:100vh;
        overflow-x:hidden;
        position:relative;
    }

    /* =========================================================
       背景层 1：世界地图铅笔素描（fixed + multiply 融合灰墙）
       ========================================================= */
    .bg-map{
        position:fixed; inset:0; z-index:0;
        background-image:url('https://image.qwenlm.ai/public_source/ad1849f7-810e-4742-98d1-aa785709bea4/171f15a5e-2a27-44e7-bdc9-4f3cd8eb0c24.png');
        background-size:cover; background-position:center; background-repeat:no-repeat;
        mix-blend-mode:multiply; opacity:.55; pointer-events:none;
        animation:mapBreathe 38s ease-in-out infinite alternate;
    }
    @keyframes mapBreathe{ from{transform:scale(1.02);} to{transform:scale(1.08);} }

    /* 背景层 2：暗角，聚焦中心票根墙 */
    .bg-vignette{
        position:fixed; inset:0; z-index:0; pointer-events:none;
        background:radial-gradient(ellipse at center,
            rgba(196,194,188,0) 38%,
            rgba(150,148,142,.35) 78%,
            rgba(120,118,112,.6) 100%);
    }
    /* 背景层 3：极淡纸纹颗粒 */
    .bg-grain{
        position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.06;
        background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    /* =========================================================
       左上角 LOGO —— 返回主页按钮（内联 SVG：三横条 + 斜插票根）
       部署时把 href="#" 改为真实主页地址
       移动端（≤1099）隐藏：回主页职责改由抽屉头部的 HOME 承担
       ========================================================= */
    .logo{
        position:fixed;
        top:calc(28px + env(safe-area-inset-top, 0px));
        left:calc(42px + env(safe-area-inset-left, 0px));
        z-index:120; width:42px; height:52px; display:block; cursor:pointer;
        text-decoration:none; color:var(--ink); -webkit-tap-highlight-color:transparent;
    }
    .logo svg{
        display:block; width:100%; height:100%; overflow:visible;
        transition:transform .45s cubic-bezier(.2,.8,.2,1), filter .45s ease, color .35s ease;
        filter:drop-shadow(0 1px 0 rgba(0,0,0,.18));
    }
    .logo:hover svg, .logo:focus-visible svg{
        transform:translateY(-3px) rotate(-2.5deg);
        filter:drop-shadow(0 7px 9px rgba(0,0,0,.32)); color:#000;
    }
    .logo:focus-visible{outline:none;}

    /* =========================================================
       右侧导航菜单（fixed 垂直居中，仅宽屏显示）
       ========================================================= */
    .nav-menu{
        position:fixed; right:42px; top:50%; transform:translateY(-50%);
        z-index:120; display:flex; flex-direction:column; gap:20px; text-align:right;
    }
    .nav-menu a{
        position:relative; text-decoration:none; color:var(--ink);
        font-size:13px; font-weight:700; letter-spacing:3px;
        transition:color .3s ease, letter-spacing .3s ease;
    }
    .nav-menu a::after{
        content:''; position:absolute; right:0; bottom:-5px; width:0; height:1.5px;
        background:var(--ink); transition:width .35s cubic-bezier(.2,.8,.2,1);
    }
    .nav-menu a:hover{letter-spacing:4px;}
    .nav-menu a:hover::after{width:100%;}

    /* =========================================================
       移动端菜单按钮（仅窄屏显示，右上角，与 logo 对称）
       ========================================================= */
    .menu-btn{
        position:fixed;
        top:calc(30px + env(safe-area-inset-top, 0px));
        right:calc(24px + env(safe-area-inset-right, 0px));
        z-index:260; display:none;
        align-items:center; gap:11px;
        background:transparent; border:none; cursor:pointer;
        color:var(--ink); -webkit-tap-highlight-color:transparent; padding:8px 4px;
    }
    .menu-btn .bars{ position:relative; width:24px; height:14px; flex:0 0 auto; }
    .menu-btn .bars i{
        position:absolute; left:0; width:100%; height:2px; background:currentColor; border-radius:1px;
        transition:transform .4s cubic-bezier(.2,.8,.2,1), top .4s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
    }
    .menu-btn .bars i:nth-child(1){top:0;}
    .menu-btn .bars i:nth-child(2){top:12px;}
    .menu-btn .lbl{ font-family:'Space Mono', monospace; font-size:11px; font-weight:700; letter-spacing:3px; }
    .menu-btn .lbl .t-close{display:none;}
    .menu-btn.open .bars i:nth-child(1){top:6px; transform:rotate(45deg);}
    .menu-btn.open .bars i:nth-child(2){top:6px; transform:rotate(-45deg);}
    .menu-btn.open .lbl .t-open{display:none;}
    .menu-btn.open .lbl .t-close{display:inline;}

    /* 抽屉遮罩 */
    .drawer-backdrop{
        position:fixed; inset:0; z-index:240;
        background:rgba(20,19,17,.5); backdrop-filter:blur(4px);
        opacity:0; visibility:hidden; transition:opacity .4s ease, visibility .4s;
    }
    .drawer-backdrop.open{opacity:1; visibility:visible;}

    /* 抽屉面板：纸色档案卡，右侧滑入 */
    .nav-drawer{
        position:fixed; top:0; right:0; z-index:250;
        width:min(82vw, 330px); height:100%;
        height:calc(100% + env(safe-area-inset-top, 0px));
        padding-top:env(safe-area-inset-top, 0px);
        background:var(--paper);
        box-shadow:-22px 0 60px rgba(0,0,0,.32);
        transform:translateX(102%);
        transition:transform .55s cubic-bezier(.2,.85,.25,1);
        display:flex; flex-direction:column;
        border-left:3px solid var(--ink);
    }
    .nav-drawer.open{transform:translateX(0);}
    .nav-drawer::before{
        content:''; position:absolute; top:26px; right:24px;
        width:14px; height:14px; border-radius:50%;
        background:var(--wall); box-shadow:inset 0 1px 3px rgba(0,0,0,.3);
    }
    /* 抽屉头部：HOME 回主页链接（移动端 logo 隐藏后，由此承担回主页职责） */
    .drawer-home{
        display:inline-flex; align-items:center; gap:8px;
        margin:78px 34px 0; align-self:flex-start;
        text-decoration:none; color:var(--ink-soft);
        font-size:11px; font-weight:700; letter-spacing:3px;
        padding:6px 0; transition:color .3s ease, gap .3s ease;
    }
    .drawer-home .arr{ transition:transform .3s cubic-bezier(.2,.8,.2,1); }
    .drawer-home:active{color:var(--ink); gap:4px;}
    .drawer-home:active .arr{transform:translateX(-4px);}
    .drawer-head{
        padding:18px 34px 0;
        font-size:10px; letter-spacing:3px; color:var(--ink-soft); text-transform:uppercase;
    }
    .drawer-head b{
        display:block; font-family:'Special Elite', monospace; font-size:18px;
        letter-spacing:3px; color:var(--ink); margin-top:6px;
    }
    .drawer-list{ list-style:none; margin:auto 0; padding:0 34px; counter-reset:didx; }
    .drawer-list li{
        counter-increment:didx; opacity:0; transform:translateX(22px);
        transition:opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1);
    }
    .nav-drawer.open .drawer-list li{opacity:1; transform:translateX(0);}
    .nav-drawer.open .drawer-list li:nth-child(1){transition-delay:.12s;}
    .nav-drawer.open .drawer-list li:nth-child(2){transition-delay:.18s;}
    .nav-drawer.open .drawer-list li:nth-child(3){transition-delay:.24s;}
    .nav-drawer.open .drawer-list li:nth-child(4){transition-delay:.30s;}
    .nav-drawer.open .drawer-list li:nth-child(5){transition-delay:.36s;}
    .drawer-list a{
        display:flex; align-items:baseline; gap:14px; text-decoration:none; color:var(--ink);
        font-size:17px; font-weight:700; letter-spacing:2px;
        padding:15px 0; border-bottom:1px dashed rgba(38,36,32,.3);
        transition:padding-left .3s ease, color .3s ease;
    }
    .drawer-list a::before{
        content:counter(didx, decimal-leading-zero);
        font-size:11px; font-weight:400; letter-spacing:1px; color:var(--ink-soft);
    }
    .drawer-list a:active{padding-left:8px; color:#000;}
    .drawer-foot{
        padding:0 34px 34px; padding-bottom:calc(34px + env(safe-area-inset-bottom, 0px));
        font-size:10px; letter-spacing:2px; color:var(--ink-soft); line-height:1.8;
    }

    /* =========================================================
       主舞台：票根墙整体居中自适应
       ========================================================= */
    .stage{
        position:relative; z-index:2; width:100%;
        max-width:min(1500px, calc(100vw - 360px));
        margin:0 auto; padding:118px 60px 90px;
    }

    .archive-head{
        border-bottom:1px dashed rgba(38,36,32,.4);
        padding-bottom:14px; margin-bottom:42px;
    }
    .archive-head .ah-title{
        font-family:'Special Elite', monospace;
        font-size:15px; letter-spacing:3px; color:var(--ink);
    }
    .archive-head .ah-title small{
        display:block; font-family:'Space Mono', monospace;
        font-size:10px; letter-spacing:2px; color:var(--ink-soft); margin-top:4px;
    }

    .ticket-grid{
        display:flex; flex-wrap:wrap; justify-content:center;
        align-content:flex-start; gap:30px 26px;
    }

    /* =========================================================
       票根外层 wrap —— 旋转 / 阴影 / 入场 / hover 抬起
       ========================================================= */
    .ticket-wrap{
        --rot:0deg;
        position:relative; width:170px; cursor:pointer;
        transform:rotate(var(--rot));
        filter:drop-shadow(0 2px 3px rgba(0,0,0,.16)) drop-shadow(0 1px 0 rgba(0,0,0,.10));
        transition:transform .4s cubic-bezier(.2,.8,.2,1), filter .4s ease;
        opacity:0; translate:0 26px; -webkit-tap-highlight-color:transparent;
    }
    .ticket-wrap.in{
        opacity:1; translate:0 0;
        transition:transform .4s cubic-bezier(.2,.8,.2,1), filter .4s ease,
                   opacity .7s ease, translate .7s cubic-bezier(.2,.8,.2,1);
    }
    .ticket-wrap:hover{
        transform:rotate(0deg) translateY(-9px) scale(1.035);
        filter:drop-shadow(0 18px 26px rgba(0,0,0,.30)) drop-shadow(0 3px 4px rgba(0,0,0,.18));
        z-index:5;
    }
    .ticket-wrap:focus-visible{outline:none;}
    .ticket-wrap:focus-visible .ticket{outline:2px dashed var(--ink); outline-offset:3px;}

    /* =========================================================
       票根本体 —— 纸张 + 圆角 + 透明缺口（mask 挖洞）
       ========================================================= */
    .ticket{
        width:100%; background:var(--paper); border-radius:3px; position:relative;
        -webkit-mask-image:
            radial-gradient(circle at 0% 50%,   #0000 var(--notch), #000 calc(var(--notch) + .6px)),
            radial-gradient(circle at 100% 50%, #0000 var(--notch), #000 calc(var(--notch) + .6px));
        -webkit-mask-repeat:no-repeat; -webkit-mask-composite:source-in;
        mask-image:
            radial-gradient(circle at 0% 50%,   #0000 var(--notch), #000 calc(var(--notch) + .6px)),
            radial-gradient(circle at 100% 50%, #0000 var(--notch), #000 calc(var(--notch) + .6px));
        mask-repeat:no-repeat; mask-composite:intersect;
    }

    .t-photo{
        width:148px; height:104px; margin:11px auto 0;
        overflow:hidden; border-radius:2px; background:#bdb8ad; position:relative;
    }
    .t-photo img{
        width:100%; height:100%; object-fit:cover; display:block;
        filter:saturate(.92) contrast(1.02);
        transition:transform .6s cubic-bezier(.2,.8,.2,1), filter .4s ease;
    }
    .ticket-wrap:hover .t-photo img{transform:scale(1.08); filter:saturate(1.05) contrast(1.05);}

    /* 视频票根标识：中央播放徽章 + 脉冲环，暗示“此张为动态影像” */
    .play-badge{
        position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
        width:34px; height:34px; border-radius:50%;
        background:rgba(20,19,17,.55); backdrop-filter:blur(2px);
        display:flex; align-items:center; justify-content:center;
        box-shadow:0 2px 8px rgba(0,0,0,.35);
        transition:transform .4s cubic-bezier(.2,.8,.2,1), background .3s ease;
        pointer-events:none;
    }
    .play-badge svg{ width:13px; height:13px; fill:#f4f1ea; margin-left:2px; }
    .play-badge::after{
        content:''; position:absolute; inset:0; border-radius:50%;
        border:1.5px solid rgba(244,241,234,.7);
        animation:badgePulse 2.4s ease-out infinite;
    }
    @keyframes badgePulse{
        0%{transform:scale(1); opacity:.8;}
        70%{transform:scale(1.7); opacity:0;}
        100%{transform:scale(1.7); opacity:0;}
    }
    .ticket-wrap:hover .play-badge{transform:translate(-50%,-50%) scale(1.12); background:rgba(20,19,17,.72);}

    .t-info{padding:13px 8px 9px; text-align:center;}
    .t-loc{
        font-size:10.5px; font-weight:700; letter-spacing:1.2px; color:var(--ink);
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .t-date{font-size:10px; color:var(--ink-soft); margin-top:4px; letter-spacing:1px;}
    .t-perf{height:0; margin:0 12px; border-top:1.5px dashed rgba(38,36,32,.45);}
    /* 票根底部：经纬度（两位小数，单行；窄屏缩字防溢出） */
    .t-code{
        padding:9px 6px 13px; text-align:center;
        font-size:8.5px; letter-spacing:.6px; color:var(--ink-soft); white-space:nowrap;
    }

    /* =========================================================
       放大查看层（遮罩 + 大票根 + 上一张 / 下一张）
       ========================================================= */
    .overlay{
        position:fixed; inset:0; z-index:300;
        display:flex; align-items:center; justify-content:center; padding:24px;
        background:rgba(20,19,17,0); backdrop-filter:blur(0px); visibility:hidden;
        transition:background .45s ease, backdrop-filter .45s ease, visibility .45s;
    }
    .overlay.open{ background:rgba(20,19,17,.84); backdrop-filter:blur(8px); visibility:visible; }

    .viewer-wrap{
        position:relative; width:min(94vw, 1040px);
        filter:drop-shadow(0 40px 80px rgba(0,0,0,.6));
    }
    .viewer{
        position:relative; width:100%; background:var(--paper);
        border-radius:6px; padding:30px 30px 34px;
        transform:scale(.82) translateY(20px); opacity:0;
        transition:transform .5s cubic-bezier(.2,.9,.25,1), opacity .45s ease;
        -webkit-mask-image:
            radial-gradient(circle at 0% 50%,   #0000 var(--notch-lg), #000 calc(var(--notch-lg) + .8px)),
            radial-gradient(circle at 100% 50%, #0000 var(--notch-lg), #000 calc(var(--notch-lg) + .8px));
        -webkit-mask-repeat:no-repeat; -webkit-mask-composite:source-in;
        mask-image:
            radial-gradient(circle at 0% 50%,   #0000 var(--notch-lg), #000 calc(var(--notch-lg) + .8px)),
            radial-gradient(circle at 100% 50%, #0000 var(--notch-lg), #000 calc(var(--notch-lg) + .8px));
        mask-repeat:no-repeat; mask-composite:intersect;
    }
    .overlay.open .viewer{transform:scale(1) translateY(0); opacity:1;}

    /* 媒体容器：承载 img 或 video，整体淡入切换 */
    .v-photo{
        width:100%; height:clamp(420px, 66vh, 720px);
        overflow:hidden; border-radius:3px; background:#15140f; position:relative;
        transition:opacity .3s ease;
    }
    .v-photo.swap{opacity:0;}
    .v-photo img, .v-photo video{
        width:100%; height:100%; object-fit:cover; display:block;
    }
    .v-photo video{ background:#000; }

    /* 放大查看器自定义播放按钮（叠在视频中央，统一视觉） */
    .v-play{
        position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
        width:84px; height:84px; border-radius:50%; border:none; cursor:pointer;
        background:rgba(20,19,17,.5); backdrop-filter:blur(3px);
        display:flex; align-items:center; justify-content:center;
        box-shadow:0 6px 24px rgba(0,0,0,.45);
        transition:opacity .35s ease, transform .35s cubic-bezier(.2,.8,.2,1), background .3s ease;
    }
    .v-play svg{ width:30px; height:30px; fill:#f4f1ea; margin-left:5px; }
    .v-play:hover{ background:rgba(20,19,17,.72); transform:translate(-50%,-50%) scale(1.08); }
    .v-play.hide{ opacity:0; pointer-events:none; transform:translate(-50%,-50%) scale(.7); }

    .v-info{
        display:flex; justify-content:space-between; align-items:flex-end;
        flex-wrap:wrap; gap:8px; padding:26px 4px 16px;
    }
    .v-loc{ font-family:'Special Elite', monospace; font-size:clamp(24px,3.4vw,40px); letter-spacing:3px; color:var(--ink); }
    .v-date{ font-size:clamp(14px,1.8vw,18px); color:var(--ink-soft); letter-spacing:2px; }
    .v-note{ padding:0 4px 18px; font-size:clamp(13px,1.5vw,16px); line-height:1.75; color:var(--ink-soft); max-width:70ch; }
    .v-perf{ border-top:1.5px dashed rgba(38,36,32,.45); margin:0 4px; }
    .v-foot{
        display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;
        padding:16px 4px 2px; font-size:12px; letter-spacing:2px; color:var(--ink-soft);
    }
    .v-foot .v-idx{color:var(--ink); font-weight:700;}
    /* 视频票根在底部多一个 MEDIA 标签，标明影像类型 */
    .v-foot .v-media{
        font-size:10px; letter-spacing:2px; color:var(--ink);
        border:1px solid rgba(38,36,32,.4); border-radius:2px; padding:2px 7px;
    }

    .v-close{
        position:absolute; top:-50px; right:0; width:40px; height:40px;
        border:none; background:transparent; color:#f2efe8; font-size:36px; line-height:1; cursor:pointer;
        transition:transform .4s ease, color .3s ease;
    }
    .v-close:hover{transform:rotate(90deg); color:#fff;}

    .v-nav{
        position:absolute; top:50%; transform:translateY(-50%);
        width:52px; height:52px; border-radius:50%;
        border:1px solid rgba(242,239,232,.5); background:rgba(20,19,17,.35);
        color:#f2efe8; font-size:22px; cursor:pointer;
        display:flex; align-items:center; justify-content:center;
        transition:background .3s ease, transform .3s ease, border-color .3s ease; z-index:2;
    }
    .v-nav:hover{background:rgba(20,19,17,.7); border-color:#f2efe8;}
    .v-prev{left:-78px;}
    .v-next{right:-78px;}
    .v-prev:hover{transform:translateY(-50%) translateX(-3px);}
    .v-next:hover{transform:translateY(-50%) translateX(3px);}

    /* 触摸设备：取消 hover 抬起，改 :active 按压反馈 */
    @media (hover:none){
        .ticket-wrap:hover{
            transform:rotate(var(--rot));
            filter:drop-shadow(0 2px 3px rgba(0,0,0,.16)) drop-shadow(0 1px 0 rgba(0,0,0,.10));
        }
        .ticket-wrap:hover .t-photo img{transform:none; filter:saturate(.92) contrast(1.02);}
        .ticket-wrap:hover .play-badge{transform:translate(-50%,-50%); background:rgba(20,19,17,.55);}
        .ticket-wrap:active{transform:rotate(var(--rot)) scale(.95);}
        .logo:hover svg{transform:none; filter:drop-shadow(0 1px 0 rgba(0,0,0,.18));}
    }

    /* =========================================================
       响应式断点
       ========================================================= */
    @media (max-width:1320px){
        .v-prev{left:10px; background:rgba(20,19,17,.6);}
        .v-next{right:10px; background:rgba(20,19,17,.6);}
    }

    /* ≤1099：隐藏右侧竖排 nav + 左上 logo，启用汉堡抽屉；舞台全宽居中 */
    @media (max-width:1099px){
        .nav-menu{display:none;}
        .logo{display:none;}                       /* 移动端不展示 logo，回主页由抽屉 HOME 承担 */
        .menu-btn{display:flex;}
        .stage{
            max-width:1500px; padding:108px 28px 70px;
            padding-left:calc(28px + env(safe-area-inset-left, 0px));
            padding-right:calc(28px + env(safe-area-inset-right, 0px));
        }
    }

    /* 放大查看器：平板 / 大手机适配 */
    @media (max-width:680px){
        :root{--notch-lg:9px;}
        .overlay{padding:14px;}
        .viewer{padding:20px 18px 24px; border-radius:5px;}

/* =====================================================================
   工具：经纬度数值 → 显示字符串
   wall=true 两位小数（墙上紧凑），否则四位小数（放大完整）
   ===================================================================== */
function fmtCoord(lat, lng, wall){
    const d = wall ? 2 : 4;
    const ns = lat >= 0 ? 'N' : 'S';
    const ew = lng >= 0 ? 'E' : 'W';
    const sep = wall ? ' ' : ' / ';
    return Math.abs(lat).toFixed(d) + '°' + ns + sep + Math.abs(lng).toFixed(d) + '°' + ew;
}

/* 播放三角图标（墙上徽章 / 放大按钮共用） */
const PLAY_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

/* 墙上缩略媒体 HTML：image→img；video→poster 图 + 播放徽章 */
function mediaThumbHTML(t){
    if (t.type === 'video'){
        return `<div class="t-photo"><img src="${t.poster}" alt="${t.display}" loading="lazy">`
             + `<span class="play-badge" aria-hidden="true">${PLAY_SVG}</span></div>`;
    }
    return `<div class="t-photo"><img src="${t.image}" alt="${t.display}" loading="lazy"></div>`;
}

/* =====================================================================
   渲染票根墙
   ===================================================================== */
const grid = document.getElementById('ticketGrid');

function tinyRotation(i){
    const seq = [-1.1, 0.7, -0.5, 1.0, -0.8, 0.6, -1.0, 0.9, -0.6, 1.1, -0.9, 0.5, -0.7, 0.8, -1.0, 0.6, -0.5, 0.9, -0.8, 0.7, -0.6];
    return (seq[i % seq.length]) + 'deg';
}

function buildTickets(){
    grid.innerHTML = '';
    TICKETS.forEach((t, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'ticket-wrap';
        wrap.style.setProperty('--rot', tinyRotation(i));
        wrap.dataset.index = i;
        wrap.setAttribute('tabindex', '0');
        wrap.setAttribute('role', 'button');
        wrap.setAttribute('aria-label', '查看 ' + t.display + (t.type === 'video' ? '（视频）' : ''));
        wrap.innerHTML = `
            <article class="ticket">
                ${mediaThumbHTML(t)}
                <div class="t-info">
                    <div class="t-loc">${t.display}</div>
                    <div class="t-date">${t.date}</div>
                </div>
                <div class="t-perf"></div>
                <div class="t-code">${fmtCoord(t.lat, t.lng, true)}</div>
            </article>
        `;
        wrap.addEventListener('click', () => openViewer(i));
        wrap.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openViewer(i); }
        });
        grid.appendChild(wrap);
    });
}

function revealOnScroll(){
    const items = Array.from(document.querySelectorAll('.ticket-wrap'));
    if (!('IntersectionObserver' in window)){ items.forEach(el => el.classList.add('in')); return; }
    const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting){
                const el = entry.target;
                const delay = (Array.from(grid.children).indexOf(el) % 7) * 70;
                setTimeout(() => el.classList.add('in'), delay);
                io.unobserve(el);
            }
        });
    }, { threshold:0.12 });
    items.forEach(el => io.observe(el));
}

const vPhoto  = document.getElementById('vPhoto');
const vLoc    = document.getElementById('vLoc');
const vDate   = document.getElementById('vDate');
const vNote   = document.getElementById('vNote');
const vIdx    = document.getElementById('vIdx');
const vCode   = document.getElementById('vCode');
const vMedia  = document.getElementById('vMedia');
let current = 0;

/* 停掉并清理容器内现有 video，防止切张 / 关闭后后台继续播放发声 */
function cleanupVideo(){
    const v = vPhoto.querySelector('video');
    if (v){ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(_){} }
}

/* 在放大容器内渲染媒体：image→img；video→video(controls)+自定义播放按钮 */
function renderFullMedia(t){
    cleanupVideo();
    if (t.type === 'video'){
        vPhoto.innerHTML =
            `<video src="${t.video}" poster="${t.poster}" controls playsinline webkit-playsinline preload="metadata"></video>`
          + `<button class="v-play" aria-label="播放视频">${PLAY_SVG}</button>`;
        const vid = vPhoto.querySelector('video');
        const vb  = vPhoto.querySelector('.v-play');
        vb.addEventListener('click', () => { vid.play().catch(()=>{}); });
        vid.addEventListener('play',  () => vb.classList.add('hide'));
        vid.addEventListener('pause', () => { if (!vid.ended) vb.classList.remove('hide'); });
        vid.addEventListener('ended', () => vb.classList.remove('hide'));
    } else {
        vPhoto.innerHTML = `<img src="${t.image}" alt="${t.display}">`;
    }
}

function fillViewer(i){
    const t = TICKETS[i];
    // 整体淡入切换
    vPhoto.classList.add('swap');
    setTimeout(() => {
        renderFullMedia(t);
        vPhoto.classList.remove('swap');
    }, 180);

    vLoc.textContent  = t.display;
    vDate.textContent = t.date;
    vNote.textContent = t.note;
    vCode.textContent = fmtCoord(t.lat, t.lng, false);
    vIdx.textContent  = String(i + 1).padStart(2, '0') + ' / ' + String(TICKETS.length).padStart(2, '0');
    // 视频票根显示 MEDIA 标签
    if (t.type === 'video'){ vMedia.hidden = false; vMedia.textContent = '▶ VIDEO'; }
    else { vMedia.hidden = true; }
}

function openViewer(i){
    current = i;
    fillViewer(i);
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
}
function closeViewer(){
    cleanupVideo();                       // 关闭即停视频
    overlay.classList.remove('open');
    if (!drawer.classList.contains('open')) document.body.style.overflow = '';
}
function step(dir){
    current = (current + dir + TICKETS.length) % TICKETS.length;
    fillViewer(current);
}

document.getElementById('vClose').addEventListener('click', closeViewer);
document.getElementById('vPrev').addEventListener('click', (e) => { e.stopPropagation(); step(-1); });
document.getElementById('vNext').addEventListener('click', (e) => { e.stopPropagation(); step(1); });
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeViewer(); });

/* =====================================================================
   移动端抽屉菜单
   ===================================================================== */
const menuBtn        = document.getElementById('menuBtn');
const drawer         = document.getElementById('navDrawer');
const drawerBackdrop = document.getElementById('drawerBackdrop');

function openDrawer(){
    drawer.classList.add('open'); drawerBackdrop.classList.add('open'); menuBtn.classList.add('open');
    menuBtn.setAttribute('aria-expanded', 'true'); drawer.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
}
function closeDrawer(){
    drawer.classList.remove('open'); drawerBackdrop.classList.remove('open'); menuBtn.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false'); drawer.setAttribute('aria-hidden', 'true');
    if (!overlay.classList.contains('open')) document.body.style.overflow = '';
}
function toggleDrawer(){ drawer.classList.contains('open') ? closeDrawer() : openDrawer(); }

menuBtn.addEventListener('click', toggleDrawer);
drawerBackdrop.addEventListener('click', closeDrawer);
drawer.querySelectorAll('.drawer-list a').forEach(a => a.addEventListener('click', closeDrawer));

const MQ_WIDE = window.matchMedia('(min-width: 1100px)');
(MQ_WIDE.addEventListener ? MQ_WIDE.addEventListener.bind(MQ_WIDE, 'change') : MQ_WIDE.addListener.bind(MQ_WIDE))((e) => {
    if (e.matches) closeDrawer();
});

/* =====================================================================
   全局键盘：ESC 优先关查看器，其次关抽屉；方向键切换票根
   ===================================================================== */
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){
        if (overlay.classList.contains('open')) closeViewer();
        else if (drawer.classList.contains('open')) closeDrawer();
        return;
    }
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
});

/* 回主页：本地预览时阻止跳转，部署后可删除，仅保留 href */
function guardHome(e){ if (location.protocol === 'file:') e.preventDefault(); }
document.getElementById('logo').addEventListener('click', guardHome);
document.getElementById('drawerHome').addEventListener('click', (e) => { guardHome(e); closeDrawer(); });

/* 初始化 */
buildTickets();
revealOnScroll();
</script>
</body>
</html>
