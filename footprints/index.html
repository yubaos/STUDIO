<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FOOTPRINTS — 旅行票根档案</title>
<!-- Google Fonts - Space Mono & Special Elite -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- =========================================================
         背景层（固定定位，不参与滚动）
         1. 铅笔地图纹理
         2. 暗角效果（聚焦中心）
         3. 纸纹颗粒质感
         ========================================================= -->
    <div class="bg-map" aria-hidden="true"></div>
    <div class="bg-vignette" aria-hidden="true"></div>
    <div class="bg-grain" aria-hidden="true"></div>

    <!-- =========================================================
         左上角 LOGO：返回主页按钮
         注意：部署时请将 href="#" 改为真实主页地址
         移动端（≤1099px）会自动隐藏，由抽屉导航的 HOME 按钮替代
         ========================================================= -->
    <a href="/" class="logo" id="logo" title="返回主页 / HOME" aria-label="返回主页">
        <svg viewBox="404 343 494 614" xmlns="http://www.w3.org/2000/svg"
             style="shape-rendering:geometricPrecision;text-rendering:geometricPrecision;image-rendering:optimizeQuality;fill-rule:evenodd;clip-rule:evenodd"
             aria-hidden="true" focusable="false">
            <path fill="currentColor" stroke="none" d="M414.99 453c0-33.17.01-66.34.03-99.5.66-5.09 3.49-8.21 8.49-9.39 150.66-.11 301.32-.15 451.99-.11 6.68.13 10.89 4.85 10.51 11.5 0 33.34-.01 66.67-.03 100-1.1 6.44-4.93 9.61-11.48 9.51q-225 0-450-.03c-6.59-.74-9.91-5.5-9.51-11.98Zm2 196c0-33.17.01-66.34.03-99.5.66-5.09 3.49-8.21 8.49-9.39 149.99-.11 299.99-.15 449.99-.11 6.68.13 10.89 4.85 10.51 11.5 0 33.34-.01 66.67-.03 100-1.1 6.44-4.93 9.61-11.48 9.51-149.34 0-298.67-.01-448-.03-6.59-.74-9.91-5.5-9.51-11.98Zm239.17 30.05c-.11-1.19 1.6-1.03 2.32-1.06q67.515.015 135.03 0c.87.01 1.71.16 2.51.47 18.52 9.86 20.19 26.4 23.75 45.05 5.25 31.78 9.94 63.37 16.99 94.82-.61.6-1.36.83-2.24.68-51.26.06-102.51-.05-153.75-.31-.38-.32-.58-.74-.58-1.24-5.6-46.04-15.62-92.72-24.03-138.41ZM416.99 944c0-32.84.01-65.67.03-98.5.66-5.09 3.49-8.21 8.49-9.39 149.99-.11 299.99-.15 449.99-.11 6.68.13 10.89 4.85 10.51 11.5q0 49.5-.03 99c-1.1 6.44-4.93 9.61-11.48 9.51-149.34 0-298.67-.01-448-.03-6.59-.74-9.91-5.5-9.51-11.98Z"/>
        </svg>
    </a>

    <!-- =========================================================
         右侧竖排导航菜单（仅宽屏显示 ≥1100px）
         与首页风格保持一致
         ========================================================= -->
    <nav class="nav-menu" aria-label="主导航">
        <a href="/#work">WORK</a>
        <a href="/about/">ABOUT</a>
        <a href="#footprints">FOOTPRINTS</a>
        <a href="#time-machine">TIME MACHINE</a>
        <a href="#contact">CONTACT</a>
    </nav>

    <!-- =========================================================
         移动端汉堡菜单按钮（仅窄屏显示 ＜1100px，右上角）
         包含两根横条动画和文字标签
         ========================================================= -->
    <button class="menu-btn" id="menuBtn" aria-label="打开菜单" aria-expanded="false" aria-controls="navDrawer">
        <span class="bars" aria-hidden="true"><i></i><i></i></span>
        <span class="lbl"><span class="t-open">MENU</span><span class="t-close">CLOSE</span></span>
    </button>

    <!-- 抽屉遮罩层（点击关闭抽屉） -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <!-- =========================================================
         移动端抽屉导航面板（从右侧滑入）
         包含：回主页链接、目录列表、底部坐标信息
         ========================================================= -->
    <aside class="nav-drawer" id="navDrawer" aria-label="移动端导航" aria-hidden="true">
        <!-- 回主页链接（移动端 logo 隐藏后，由此承担返回主页职责） -->
        <a href="/" class="drawer-home" id="drawerHome" title="返回主页 / HOME">
            <span class="arr" aria-hidden="true">&#8592;</span> HOME / 主页
        </a>
        <div class="drawer-head">
            INDEX
            <b>目录 / MENU</b>
        </div>
        <ul class="drawer-list">
            <li><a href="/#work">WORK</a></li>
            <li><a href="/about/">ABOUT</a></li>
            <li><a href="#footprints">FOOTPRINTS</a></li>
            <li><a href="#time-machine">TIME MACHINE</a></li>
            <li><a href="#contact">CONTACT</a></li>
        </ul>
        <div class="drawer-foot">
            © 2026 YUBAO. All Rights Reserved
        </div>
    </aside>

    <!-- =========================================================
         主舞台：票根墙容器
         标题 + 票根网格（自适应布局）
         ========================================================= -->
    <main class="stage">
        <header class="archive-head">
            <div class="ah-title">
                FOOTPRINTS
                <small>旅行票根档案 · A TRAVEL ARCHIVE</small>
            </div>
        </header>
        <!-- 票根墙网格容器：JS 将在此处动态渲染所有票根 -->
        <section class="ticket-grid" id="ticketGrid" aria-label="票根墙"></section>
    </main>

    <!-- =========================================================
         放大查看器（Overlay）
         点击票根后弹出的全屏查看界面，支持图片/视频播放
         包含：上一张/下一张导航、关闭按钮、位置/日期/描述信息
         ========================================================= -->
    
    <!-- Video.js 样式 -->
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
    
    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="票根大图">
        <button class="v-nav v-prev" id="vPrev" aria-label="上一张">&#8249;</button>
        <div class="viewer-wrap">
            <div class="viewer" id="viewer">
                <button class="v-close" id="vClose" aria-label="关闭">&times;</button>
                <div class="v-photo" id="vPhoto"></div>
                <div class="v-info">
                    <div class="v-loc" id="vLoc"></div>
                    <div class="v-date" id="vDate"></div>
                </div>
                <p class="v-note" id="vNote"></p>
                <div class="v-perf"></div>
                <div class="v-foot">
                    <span class="v-idx" id="vIdx"></span>
                    <span class="v-media" id="vMedia" hidden></span>
                    <span id="vCode"></span>
                </div>
            </div>
        </div>
        <button class="v-nav v-next" id="vNext" aria-label="下一张">&#8250;</button>
    </div>

    <!-- Video.js 脚本 -->
    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
