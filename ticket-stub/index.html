<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TICKET STUB — 旅行票根档案</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Google Fonts - Space Mono & Special Elite -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- =========================================================
         背景层（固定定位，不参与滚动）
         1. 铅笔地图纹理
         2. 暗角效果（聚焦中心）
         3. 纸纹颗粒质感
         ========================================================= -->
    <div class="bg-map" aria-hidden="true"></div>
    <div class="bg-vignette" aria-hidden="true"></div>
    <div class="bg-grain" aria-hidden="true"></div>

    <!-- =========================================================
         左上角 LOGO：返回主页按钮
         注意：部署时请将 href="#" 改为真实主页地址
         移动端（≤1099px）会自动隐藏，由抽屉导航的 HOME 按钮替代
         ========================================================= -->
    <a href="/" class="logo" id="logo" title="返回主页 / HOME" aria-label="返回主页">
        <svg viewBox="150 175 755 685" xmlns="http://www.w3.org/2000/svg"
             preserveAspectRatio="none"
             style="shape-rendering:geometricPrecision;text-rendering:geometricPrecision;image-rendering:optimizeQuality;fill-rule:evenodd;clip-rule:evenodd"
             aria-hidden="true" focusable="false">
            <path fill="currentColor" stroke="none" d="m177.6 175.6-2.6 2.7v123.4l2.6 2.7 2.7 2.6h544.4l2.7-2.6 2.6-2.7V178.3l-2.6-2.7-2.7-2.6H180.3zm0 195-2.6 2.7v128.4l2.6 2.7 2.7 2.6h542.4l2.7-2.6 2.6-2.7V373.3l-2.6-2.7-2.7-2.6H180.3zM459 526c0 .6 3.4 19.1 7.5 41.3 10.1 53.6 16.9 93.2 19.1 109.9l1.8 13.8h92.3c50.8 0 92.3-.3 92.3-.7s-2-10.6-4.5-22.7c-2.5-12.2-6.7-36.3-9.5-53.6-6.8-42.4-10.4-60.2-14-67.7-3-6.6-9.1-13.9-15.4-18.5l-3.9-2.8h-82.9c-55.5 0-82.8.3-82.8 1M152.7 713.8c-1.6 1.7-1.7 8.2-1.7 72.9v71l2.3 2.1 2.3 2.2h591.8l2.8-2.7 2.8-2.7V716.3l-2.3-2.1-2.3-2.2H451.3c-286.4 0-297 .1-298.6 1.8"/>
        </svg>
    </a>

    <!-- =========================================================
         右侧竖排导航菜单（仅宽屏显示 ≥1100px）
         与首页风格保持一致
         ========================================================= -->
    <nav class="nav-menu" aria-label="主导航">
        <a href="/#work">WORK</a>
        <a href="/about/">ABOUT</a>
        <a href="/ticket-stub/">TICKET STUB</a>
        <a href="/footprint-map/">FOOTPRINT MAP</a>
        <a href="/time-machine/">TIME MACHINE</a>
        <a href="/#contact">CONTACT</a>
    </nav>

    <!-- =========================================================
         移动端汉堡菜单按钮（仅窄屏显示 ＜1100px，右上角）
         包含两根横条动画和文字标签
         ========================================================= -->
    <button class="menu-btn" id="menuBtn" aria-label="打开菜单" aria-expanded="false" aria-controls="navDrawer">
        <span class="bars" aria-hidden="true"><i></i><i></i></span>
        <span class="lbl"><span class="t-open">MENU</span><span class="t-close">CLOSE</span></span>
    </button>

    <!-- 抽屉遮罩层（点击关闭抽屉） -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <!-- =========================================================
         移动端抽屉导航面板（从右侧滑入）
         包含：回主页链接、目录列表、底部坐标信息
         ========================================================= -->
    <aside class="nav-drawer" id="navDrawer" aria-label="移动端导航" aria-hidden="true">
        <!-- 回主页链接（移动端 logo 隐藏后，由此承担返回主页职责） -->
        <a href="/" class="drawer-home" id="drawerHome" title="返回主页 / HOME">
            <span class="arr" aria-hidden="true">&#8592;</span> HOME / 主页
        </a>
        <div class="drawer-head">
            INDEX
            <b>目录 / MENU</b>
        </div>
        <ul class="drawer-list">
            <li><a href="/#work">WORK</a></li>
            <li><a href="/about/">ABOUT</a></li>
            <li><a href="/ticket-stub/">TICKET STUB</a></li>
            <li><a href="/footprint-map/">FOOTPRINT MAP</a></li>
            <li><a href="/time-machine/">TIME MACHINE</a></li>
            <li><a href="/#contact">CONTACT</a></li>
        </ul>
        <div class="drawer-foot">
            © 2026 YUBAO. All Rights Reserved
        </div>
    </aside>

    <!-- =========================================================
         主舞台：票根墙容器
         标题 + 票根网格（自适应布局）
         ========================================================= -->
    <main class="stage">
        <header class="archive-head">
            <div class="ah-title">
                TICKET STUB
                <small>旅行票根档案 · A TRAVEL ARCHIVE</small>
            </div>
        </header>
        <!-- 票根墙网格容器：JS 将在此处动态渲染所有票根 -->
        <section class="ticket-grid" id="ticketGrid" aria-label="票根墙"></section>
    </main>

    <!-- =========================================================
         放大查看器（Overlay）
         点击票根后弹出的全屏查看界面，支持图片/视频播放
         包含：上一张/下一张导航、关闭按钮、位置/日期/描述信息
         ========================================================= -->
    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="票根大图">
        <button class="v-nav v-prev" id="vPrev" aria-label="上一张">&#8249;</button>
        <div class="viewer-wrap">
            <div class="viewer" id="viewer">
                <button class="v-close" id="vClose" aria-label="关闭">&times;</button>
                <div class="v-photo" id="vPhoto"></div>
                <div class="v-info">
                    <div class="v-loc" id="vLoc"></div>
                    <div class="v-date" id="vDate"></div>
                </div>
                <p class="v-note" id="vNote"></p>
                <div class="v-perf"></div>
                <div class="v-foot">
                    <span class="v-idx" id="vIdx"></span>
                    <span class="v-media" id="vMedia" hidden></span>
                    <span id="vCode"></span>
                </div>
            </div>
        </div>
        <button class="v-nav v-next" id="vNext" aria-label="下一张">&#8250;</button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
