<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TIME MACHINE — 时光机</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Preload critical font to prevent flash of unstyled text -->
<link rel="preload" href="https://fonts.yubaos.com/fonts.woff2" as="font" type="font/woff2" crossorigin>
<!-- Google Fonts - Space Mono & Special Elite -->
<link rel="preconnect" href="https://fonts.yubaos.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- =========================================================
         背景层（固定定位，不参与滚动）
         1. 铅笔地图纹理
         2. 暗角效果（聚焦中心）
         3. 纸纹颗粒质感
         ========================================================= -->
    <div class="bg-map" aria-hidden="true"></div>
    <div class="bg-vignette" aria-hidden="true"></div>
    <div class="bg-grain" aria-hidden="true"></div>

    <!-- =========================================================
         左上角 LOGO：返回主页按钮
         注意：部署时请将 href="#/" 改为真实主页地址
         移动端（≤1099px）会自动隐藏，由抽屉导航的 HOME 按钮替代
         ========================================================= -->
    <a href="/" class="logo" id="logo" title="返回主页 / HOME" aria-label="返回主页">
        <svg viewBox="0 0 1 1" xmlns="http://www.w3.org/2000/svg"
             preserveAspectRatio="none"
             style="shape-rendering:geometricPrecision;text-rendering:geometricPrecision;image-rendering:optimizeQuality;fill-rule:evenodd;clip-rule:evenodd"
             aria-hidden="true" focusable="false">
            <path fill="currentColor" stroke="none" d="M0.043 0.17L0.043 0.043 0.086 0 0.957 0 0.957 0.043 0.957 0.17 0.957 0.213 0.914 0.256 0.086 0.256 0.043 0.213zM0.043 0.37L0.043 0.243 0.086 0.2 0.914 0.2 0.957 0.243 0.957 0.37 0.957 0.413 0.914 0.456 0.086 0.456 0.043 0.413zM0.457 0.52C0.457 0.52 0.5 0.71 0.543 0.93 0.586 1.15 0.629 1.34 0.643 1.41 0.657 1.48 0.671 1.56 0.671 1.56L0.814 1.56 0.957 1.56 0.957 1.52 0.914 1.3 0.871 1.08 0.829 0.86 0.786 0.69 0.743 0.61 0.7 0.56 0.614 0.52 0.457 0.52zM0.029 0.71L0 0.71 0 0.93 0 1.15 0.029 1.17 0.057 1.19 0.943 1.19 0.971 1.17 1 1.15 1 0.93 1 0.71 0.971 0.69 0.943 0.67 0.471 0.67 0.029 0.71z"/>
        </svg>
    </a>

    <!-- =========================================================
         右侧竖排导航菜单（仅宽屏显示 ≥1100px）
         与首页风格保持一致
         ========================================================= -->
    <nav class="nav-menu" aria-label="主导航">
        <a href="/#work">WORK</a>
        <a href="/about/">ABOUT</a>
        <a href="/ticket-stub/">TICKET STUB</a>
        <a href="/footprint-map/">FOOTPRINT MAP</a>
        <a href="/time-machine/">TIME MACHINE</a>
        <a href="/#contact">CONTACT</a>
    </nav>

    <!-- =========================================================
         移动端汉堡菜单按钮（仅窄屏显示 ＜1100px，右上角）
         包含两根横条动画和文字标签
         ========================================================= -->
    <button class="menu-btn" id="menuBtn" aria-label="打开菜单" aria-expanded="false" aria-controls="navDrawer">
        <span class="bars" aria-hidden="true"><i></i><i></i></span>
        <span class="lbl"><span class="t-open">MENU</span><span class="t-close">CLOSE</span></span>
    </button>

    <!-- 抽屉遮罩层（点击关闭抽屉） -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <!-- =========================================================
         移动端抽屉导航面板（从右侧滑入）
         包含：回主页链接、目录列表、底部坐标信息
         ========================================================= -->
    <aside class="nav-drawer" id="navDrawer" aria-label="移动端导航" aria-hidden="true">
        <!-- 回主页链接（移动端 logo 隐藏后，由此承担返回主页职责） -->
        <a href="/" class="drawer-home" id="drawerHome" title="返回主页 / HOME">
            <span class="arr" aria-hidden="true">&#8592;</span> HOME / 主页
        </a>
        <div class="drawer-head">
            INDEX
            <b>目录 / MENU</b>
        </div>
        <ul class="drawer-list">
            <li><a href="/#work">WORK</a></li>
            <li><a href="/about/">ABOUT</a></li>
            <li><a href="/ticket-stub/">TICKET STUB</a></li>
            <li><a href="/footprint-map/">FOOTPRINT MAP</a></li>
            <li><a href="/time-machine/">TIME MACHINE</a></li>
            <li><a href="/#contact">CONTACT</a></li>
        </ul>
        <div class="drawer-foot">
            © 2026 YUBAO. All Rights Reserved
        </div>
    </aside>

    <!-- =========================================================
         主舞台：时光机宫格容器
         宫格网格（自适应布局，无限滚动加载）
         ========================================================= -->
    <main class="stage">
        <!-- 时光机宫格容器 -->
        <section class="grid-container" id="gridContainer" aria-label="时光机宫格"></section>
    </main>

    <!-- =========================================================
         放大查看器（Overlay）
         点击宫格后弹出的全屏查看界面
         ========================================================= -->
    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="大图查看">
        <button class="v-nav v-prev" id="vPrev" aria-label="上一张">&#8249;</button>
        <div class="viewer-wrap">
            <div class="viewer" id="viewer">
                <button class="v-close" id="vClose" aria-label="关闭">&times;</button>
                <div class="v-photo" id="vPhoto"></div>
                <div class="v-info">
                    <div class="v-title" id="vTitle"></div>
                    <div class="v-date" id="vDate"></div>
                </div>
                <p class="v-note" id="vNote"></p>
                <div class="v-perf"></div>
                <div class="v-foot">
                    <span class="v-idx" id="vIdx"></span>
                </div>
            </div>
        </div>
        <button class="v-nav v-next" id="vNext" aria-label="下一张">&#8250;</button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
